<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#05060a" />
<title>SLEEPY EMPIRE — Play. Compete. Climb. Dominate.</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2305060a'/%3E%3Ctext x='50' y='70' font-size='56' text-anchor='middle' fill='%2300eaff' font-family='monospace' font-weight='bold'%3ESE%3C/text%3E%3C/svg%3E" />
<style>
/* ============================================================
   SLEEPY EMPIRE — DESIGN SYSTEM
   ============================================================ */
:root{
  --bg:#05060a;
  --bg-2:#080b14;
  --panel:rgba(12,18,32,.62);
  --panel-2:rgba(16,24,42,.78);
  --glass:rgba(255,255,255,.035);
  --cyan:#00eaff;
  --cyan-d:#00a8c4;
  --purple:#a855f7;
  --pink:#ff2e88;
  --green:#39ff14;
  --gold:#ffd54a;
  --red:#ff3b5c;
  --txt:#e8f4ff;
  --dim:#8296b0;
  --line:rgba(0,234,255,.16);
  --line-2:rgba(168,85,247,.20);
  --fd:'Orbitron',system-ui,sans-serif;
  --fb:'Rajdhani',system-ui,sans-serif;
  --r:14px;
  --shadow:0 18px 60px rgba(0,0,0,.65);
  --glow-c:0 0 24px rgba(0,234,255,.35);
  --glow-p:0 0 24px rgba(168,85,247,.35);
  --glow-k:0 0 24px rgba(255,46,136,.35);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg);color:var(--txt);
  font-family:var(--fb);font-size:16px;font-weight:500;
  line-height:1.5;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
/* ---------- background layers ---------- */
.bg-layer{position:fixed;inset:0;pointer-events:none;z-index:0}
.bg-grad{
  background:
    radial-gradient(1100px 700px at 15% -10%,rgba(0,234,255,.14),transparent 60%),
    radial-gradient(900px 700px at 90% 5%,rgba(168,85,247,.14),transparent 60%),
    radial-gradient(1000px 800px at 50% 115%,rgba(255,46,136,.10),transparent 60%),
    linear-gradient(180deg,#05060a 0%,#070a13 45%,#05060a 100%);
  animation:hue 26s linear infinite;
}
@keyframes hue{0%{filter:hue-rotate(0)}100%{filter:hue-rotate(360deg)}}
.bg-grid{
  background-image:
    linear-gradient(rgba(0,234,255,.055) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,234,255,.055) 1px,transparent 1px);
  background-size:56px 56px;
  mask-image:radial-gradient(ellipse 90% 75% at 50% 40%,#000 25%,transparent 100%);
  -webkit-mask-image:radial-gradient(ellipse 90% 75% at 50% 40%,#000 25%,transparent 100%);
  animation:gridpan 24s linear infinite;
}
@keyframes gridpan{from{background-position:0 0}to{background-position:56px 56px}}
.bg-scan{
  background:repeating-linear-gradient(180deg,rgba(255,255,255,.020) 0 1px,transparent 1px 3px);
  opacity:.5;mix-blend-mode:overlay;
}
#fx{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.65}
#app{position:relative;z-index:2;min-height:100vh}

/* ---------- typography ---------- */
h1,h2,h3,h4,.fd{font-family:var(--fd);font-weight:800;letter-spacing:.04em}
a{color:inherit;text-decoration:none}
.mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
.muted{color:var(--dim)}
.center{text-align:center}
.glow-c{color:var(--cyan);text-shadow:0 0 18px rgba(0,234,255,.6)}
.glow-p{color:var(--purple);text-shadow:0 0 18px rgba(168,85,247,.6)}

/* ---------- reusable atoms ---------- */
.glass{
  background:var(--panel);
  backdrop-filter:blur(18px) saturate(140%);
  -webkit-backdrop-filter:blur(18px) saturate(140%);
  border:1px solid var(--line);
  border-radius:var(--r);
  box-shadow:var(--shadow);
}
.btn{
  --bg1:linear-gradient(135deg,rgba(0,234,255,.16),rgba(168,85,247,.16));
  display:inline-flex;align-items:center;justify-content:center;gap:.55rem;
  padding:.85rem 1.6rem;border-radius:10px;cursor:pointer;
  font-family:var(--fd);font-weight:700;font-size:.82rem;letter-spacing:.13em;
  text-transform:uppercase;color:var(--txt);
  background:var(--bg1);
  border:1px solid var(--line);
  transition:transform .18s,box-shadow .25s,border-color .25s,background .25s;
  position:relative;overflow:hidden;user-select:none;
}
.btn:hover{transform:translateY(-2px);border-color:var(--cyan);box-shadow:var(--glow-c)}
.btn:active{transform:translateY(0) scale(.985)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.btn.primary{background:linear-gradient(135deg,rgba(0,234,255,.28),rgba(168,85,247,.28));border-color:rgba(0,234,255,.5)}
.btn.pink{background:linear-gradient(135deg,rgba(255,46,136,.26),rgba(168,85,247,.22));border-color:rgba(255,46,136,.5)}
.btn.danger{background:linear-gradient(135deg,rgba(255,59,92,.26),rgba(255,46,136,.18));border-color:rgba(255,59,92,.55)}
.btn.ghost{background:rgba(255,255,255,.03)}
.btn.sm{padding:.5rem .95rem;font-size:.7rem}
.btn.block{width:100%}
.btn.loading{color:transparent!important;pointer-events:none}
.btn.loading::after{
  content:'';position:absolute;inset:0;margin:auto;width:18px;height:18px;border-radius:50%;
  border:2px solid rgba(255,255,255,.25);border-top-color:var(--cyan);animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

.field{margin-bottom:1.05rem;position:relative}
.field label{
  display:block;font-family:var(--fd);font-size:.68rem;font-weight:700;
  letter-spacing:.2em;color:var(--dim);margin-bottom:.5rem;text-transform:uppercase;
}
.input-wrap{position:relative;display:flex;align-items:center}
.input-wrap .ico{position:absolute;left:14px;font-size:1rem;opacity:.5;pointer-events:none}
input,textarea,select{
  width:100%;padding:.9rem 1rem;border-radius:10px;
  background:rgba(4,8,16,.75);
  border:1px solid rgba(0,234,255,.18);
  color:var(--txt);font-family:var(--fb);font-size:1rem;font-weight:500;
  outline:none;transition:border-color .22s,box-shadow .22s,background .22s;
}
.input-wrap input{padding-left:2.7rem}
input::placeholder,textarea::placeholder{color:#4d5f75}
input:focus,textarea:focus,select:focus{
  border-color:var(--cyan);background:rgba(4,10,20,.9);
  box-shadow:0 0 0 3px rgba(0,234,255,.10),var(--glow-c);
}
input.err,textarea.err{border-color:var(--red);box-shadow:0 0 0 3px rgba(255,59,92,.12)}
.toggle-pw{
  position:absolute;right:8px;background:none;border:none;color:var(--dim);
  cursor:pointer;padding:.5rem;font-size:1rem;border-radius:8px;transition:color .2s;
}
.toggle-pw:hover{color:var(--cyan)}
.hint{font-size:.78rem;margin-top:.35rem;min-height:1em;color:var(--dim)}
.hint.err{color:#ff7d92}
.hint.ok{color:#5cffa0}
textarea{min-height:130px;resize:vertical;font-family:var(--fb)}

/* ---------- toasts ---------- */
.toasts{position:fixed;top:18px;right:18px;z-index:9000;display:flex;flex-direction:column;gap:.6rem;max-width:min(92vw,380px)}
.toast{
  padding:.85rem 1.1rem;border-radius:11px;font-weight:600;font-size:.9rem;
  background:var(--panel-2);backdrop-filter:blur(16px);
  border:1px solid var(--line);box-shadow:var(--shadow);
  animation:slideIn .3s cubic-bezier(.2,.9,.3,1.2);display:flex;gap:.6rem;align-items:flex-start;
}
.toast.ok{border-color:rgba(57,255,20,.5);box-shadow:0 0 22px rgba(57,255,20,.2)}
.toast.err{border-color:rgba(255,59,92,.5);box-shadow:0 0 22px rgba(255,59,92,.2)}
.toast.info{border-color:rgba(0,234,255,.5)}
.toast.out{animation:slideOut .25s forwards}
@keyframes slideIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes slideOut{to{transform:translateX(120%);opacity:0}}

/* ---------- modal ---------- */
.modal-root{position:fixed;inset:0;z-index:8000;display:none}
.modal-root.on{display:grid;place-items:center;background:rgba(2,4,8,.78);backdrop-filter:blur(8px);animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{
  width:min(94vw,520px);padding:1.7rem;border-radius:16px;
  background:var(--panel-2);border:1px solid var(--line);box-shadow:var(--shadow);
  animation:pop .3s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes pop{from{transform:scale(.9) translateY(16px);opacity:0}to{transform:none;opacity:1}}
.modal h3{margin-bottom:.6rem;font-size:1.15rem}
.modal p{color:var(--dim);margin-bottom:1.3rem;font-size:.95rem}
.modal-actions{display:flex;gap:.7rem;justify-content:flex-end;flex-wrap:wrap}

/* ---------- auth screens ---------- */
.auth-screen{
  min-height:100vh;display:grid;place-items:center;padding:2rem 1rem;
  position:relative;
}
.auth-card{
  width:min(96vw,470px);padding:2.4rem 2rem;border-radius:20px;
  background:var(--panel);backdrop-filter:blur(22px) saturate(150%);
  border:1px solid var(--line);box-shadow:var(--shadow),0 0 70px rgba(0,234,255,.07);
  position:relative;overflow:hidden;animation:rise .55s cubic-bezier(.2,.9,.3,1.2);
}
.auth-card::before{
  content:'';position:absolute;inset:-2px;border-radius:20px;padding:2px;
  background:linear-gradient(135deg,var(--cyan),var(--purple),var(--pink),var(--cyan));
  background-size:300% 300%;animation:borderflow 6s linear infinite;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;opacity:.55;pointer-events:none;
}
@keyframes borderflow{0%{background-position:0% 50%}100%{background-position:300% 50%}}
@keyframes rise{from{opacity:0;transform:translateY(28px) scale(.97)}to{opacity:1;transform:none}}
.brand-logo{
  font-family:var(--fd);font-weight:900;font-size:clamp(2rem,7vw,3.1rem);
  letter-spacing:.06em;text-align:center;line-height:1;
  background:linear-gradient(100deg,var(--cyan),#8be9ff,var(--purple),var(--pink),var(--cyan));
  background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shine 7s linear infinite;
  filter:drop-shadow(0 0 26px rgba(0,234,255,.4));
}
@keyframes shine{0%{background-position:0% 50%}100%{background-position:300% 50%}}
.brand-sub{
  text-align:center;font-family:var(--fd);font-size:.74rem;font-weight:700;
  letter-spacing:.42em;color:var(--dim);margin-top:.7rem;text-transform:uppercase;
}
.auth-title{
  font-size:1.35rem;text-align:center;margin:1.6rem 0 .35rem;letter-spacing:.1em;
}
.auth-desc{text-align:center;color:var(--dim);font-size:.92rem;margin-bottom:1.7rem}
.auth-foot{text-align:center;margin-top:1.4rem;font-size:.9rem;color:var(--dim)}
.link{color:var(--cyan);cursor:pointer;font-weight:700;transition:text-shadow .2s}
.link:hover{text-shadow:0 0 14px rgba(0,234,255,.75)}
.divider{height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);margin:1.4rem 0}

/* ---------- app shell ---------- */
.shell{min-height:100vh;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:100;
  display:flex;align-items:center;gap:1rem;
  padding:.75rem clamp(.8rem,3vw,2rem);
  background:rgba(5,7,12,.86);backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line);
}
.logo-sm{
  font-family:var(--fd);font-weight:900;font-size:1.02rem;letter-spacing:.06em;white-space:nowrap;
  background:linear-gradient(100deg,var(--cyan),var(--purple),var(--pink));
  background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shine 8s linear infinite;
}
.nav{display:flex;gap:.25rem;margin-left:1rem;flex:1;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{
  padding:.5rem .8rem;border-radius:8px;font-family:var(--fd);font-size:.68rem;
  font-weight:700;letter-spacing:.13em;color:var(--dim);white-space:nowrap;
  transition:color .2s,background .2s;position:relative;
}
.nav a:hover{color:var(--txt);background:rgba(255,255,255,.045)}
.nav a.on{color:var(--cyan);background:rgba(0,234,255,.09)}
.nav a.on::after{
  content:'';position:absolute;left:12%;right:12%;bottom:-1px;height:2px;border-radius:2px;
  background:var(--cyan);box-shadow:0 0 10px var(--cyan);
}
.user-chip{
  display:flex;align-items:center;gap:.6rem;padding:.35rem .7rem .35rem .4rem;
  border-radius:99px;background:rgba(255,255,255,.045);border:1px solid var(--line);
  cursor:pointer;transition:border-color .2s,box-shadow .2s;white-space:nowrap;
}
.user-chip:hover{border-color:var(--cyan);box-shadow:var(--glow-c)}
.avatar{
  width:32px;height:32px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--fd);font-weight:900;font-size:.78rem;color:#03060c;
  background:linear-gradient(135deg,var(--cyan),var(--purple));
  box-shadow:0 0 14px rgba(0,234,255,.45);flex-shrink:0;
}
.avatar.lg{width:72px;height:72px;font-size:1.6rem}
.avatar.xl{width:104px;height:104px;font-size:2.3rem}
.user-chip .nm{font-family:var(--fd);font-size:.76rem;font-weight:700;letter-spacing:.06em;max-width:130px;overflow:hidden;text-overflow:ellipsis}
.burger{display:none;background:none;border:1px solid var(--line);border-radius:9px;color:var(--txt);padding:.45rem .7rem;font-size:1.1rem;cursor:pointer}

.page{padding:clamp(1.1rem,3.5vw,2.4rem) clamp(.8rem,3vw,2rem) 4rem;max-width:1360px;margin:0 auto;width:100%}
.page-head{margin-bottom:1.8rem}
.page-title{
  font-size:clamp(1.5rem,4.4vw,2.5rem);letter-spacing:.05em;line-height:1.1;
  background:linear-gradient(100deg,#fff,var(--cyan) 40%,var(--purple) 75%,var(--pink));
  background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shine 9s linear infinite;
}
.page-sub{color:var(--dim);font-size:.98rem;margin-top:.4rem}

/* ---------- stat cards ---------- */
.stat-grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:2rem}
.stat{
  padding:1.15rem 1.25rem;border-radius:14px;position:relative;overflow:hidden;
  background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(16px);
  transition:transform .25s,box-shadow .3s,border-color .3s;
}
.stat:hover{transform:translateY(-4px);border-color:var(--cyan);box-shadow:0 0 34px rgba(0,234,255,.18)}
.stat::after{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--cyan),transparent);
  opacity:.7;animation:sweep 3.4s ease-in-out infinite;
}
@keyframes sweep{0%,100%{transform:translateX(-100%)}50%{transform:translateX(100%)}}
.stat .lbl{font-family:var(--fd);font-size:.62rem;letter-spacing:.2em;color:var(--dim);text-transform:uppercase}
.stat .val{font-family:var(--fd);font-size:clamp(1.35rem,3.6vw,1.9rem);font-weight:900;margin-top:.45rem;color:var(--cyan);text-shadow:0 0 22px rgba(0,234,255,.4);word-break:break-all}
.stat.p .val{color:var(--purple);text-shadow:0 0 22px rgba(168,85,247,.4)}
.stat.k .val{color:var(--pink);text-shadow:0 0 22px rgba(255,46,136,.4)}
.stat.g .val{color:var(--green);text-shadow:0 0 22px rgba(57,255,20,.4)}
.stat .ico{position:absolute;right:.9rem;top:.9rem;font-size:1.4rem;opacity:.28}

/* ---------- feature cards ---------- */
.feat-grid{display:grid;gap:1.3rem;grid-template-columns:repeat(auto-fit,minmax(255px,1fr))}
.feat{
  position:relative;padding:2rem 1.6rem;border-radius:18px;text-align:center;cursor:pointer;
  background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(16px);
  overflow:hidden;transition:transform .3s,box-shadow .35s,border-color .35s;
}
.feat::before{
  content:'';position:absolute;inset:0;opacity:0;transition:opacity .35s;
  background:radial-gradient(circle at 50% 0%,rgba(0,234,255,.18),transparent 65%);
}
.feat:hover{transform:translateY(-7px);border-color:var(--cyan);box-shadow:0 22px 60px rgba(0,234,255,.2)}
.feat:hover::before{opacity:1}
.feat .fi{font-size:3rem;display:block;margin-bottom:.8rem;filter:drop-shadow(0 0 20px rgba(0,234,255,.55));transition:transform .35s}
.feat:hover .fi{transform:scale(1.16) rotate(-5deg)}
.feat h3{font-size:1.18rem;letter-spacing:.1em;margin-bottom:.55rem;position:relative}
.feat p{color:var(--dim);font-size:.9rem;margin-bottom:1.35rem;position:relative;min-height:2.7em}

/* ---------- game cards ---------- */
.game-grid{display:grid;gap:1.15rem;grid-template-columns:repeat(auto-fill,minmax(255px,1fr))}
.gcard{
  border-radius:16px;overflow:hidden;position:relative;
  background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(16px);
  transition:transform .28s,box-shadow .3s,border-color .3s;display:flex;flex-direction:column;
}
.gcard:hover{transform:translateY(-6px);border-color:var(--cyan);box-shadow:0 20px 52px rgba(0,234,255,.2)}
.gcard .thumb{
  height:118px;display:grid;place-items:center;font-size:3.1rem;position:relative;overflow:hidden;
  background:linear-gradient(135deg,rgba(0,234,255,.14),rgba(168,85,247,.14),rgba(255,46,136,.12));
  border-bottom:1px solid var(--line);
}
.gcard .thumb::after{
  content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(90deg,rgba(0,0,0,.14) 0 2px,transparent 2px 4px);
  opacity:.5;
}
.gcard .body{padding:1.05rem 1.1rem 1.2rem;flex:1;display:flex;flex-direction:column}
.gcard h4{font-size:1rem;letter-spacing:.07em;margin-bottom:.35rem}
.gcard .dsc{color:var(--dim);font-size:.83rem;flex:1;margin-bottom:.85rem;line-height:1.4}
.gmeta{display:flex;gap:.75rem;flex-wrap:wrap;font-size:.72rem;font-family:var(--fd);letter-spacing:.07em;margin-bottom:.9rem}
.gmeta span{color:var(--dim)}
.gmeta b{color:var(--cyan);font-weight:700}
.diff{display:inline-block;padding:.14rem .55rem;border-radius:99px;font-size:.62rem;font-family:var(--fd);letter-spacing:.1em;font-weight:700}
.diff.Easy{background:rgba(57,255,20,.14);color:#7dff5e;border:1px solid rgba(57,255,20,.35)}
.diff.Medium{background:rgba(255,213,74,.14);color:var(--gold);border:1px solid rgba(255,213,74,.35)}
.diff.Hard{background:rgba(255,59,92,.14);color:#ff7d92;border:1px solid rgba(255,59,92,.35)}
.gcard .acts{display:flex;gap:.5rem}
.gcard .acts .btn{flex:1;padding:.6rem .5rem;font-size:.66rem}

/* ---------- game stage ---------- */
.stage-wrap{display:grid;place-items:center;gap:1.1rem}
.stage{
  position:relative;width:100%;max-width:660px;aspect-ratio:1/1;
  border-radius:16px;overflow:hidden;
  background:radial-gradient(circle at 50% 40%,rgba(0,234,255,.07),rgba(3,6,12,.96) 70%);
  border:1px solid var(--line);box-shadow:0 0 60px rgba(0,234,255,.14),inset 0 0 90px rgba(0,0,0,.6);
  touch-action:none;
}
.stage.wide{aspect-ratio:16/10;max-width:820px}
.stage canvas{display:block;width:100%;height:100%}
.hud{
  display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center;width:100%;max-width:660px;
}
.hud .pill{
  padding:.5rem 1rem;border-radius:99px;background:var(--panel);border:1px solid var(--line);
  font-family:var(--fd);font-size:.7rem;letter-spacing:.12em;backdrop-filter:blur(12px);
}
.hud .pill b{color:var(--cyan);margin-left:.4rem;text-shadow:0 0 12px rgba(0,234,255,.5)}
.overlay{
  position:absolute;inset:0;display:grid;place-items:center;text-align:center;
  background:rgba(3,6,12,.9);backdrop-filter:blur(10px);z-index:5;padding:1.4rem;
  animation:fade .25s;
}
.overlay .inner{max-width:400px;width:100%}
.overlay h2{
  font-size:clamp(1.6rem,5.5vw,2.6rem);letter-spacing:.09em;margin-bottom:1rem;
  background:linear-gradient(100deg,var(--cyan),var(--purple),var(--pink));
  background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shine 4s linear infinite;
}
.res-row{display:flex;justify-content:space-between;padding:.55rem 0;border-bottom:1px dashed rgba(255,255,255,.08);font-family:var(--fd);font-size:.82rem;letter-spacing:.06em}
.res-row b{color:var(--cyan)}
.touch-pad{display:none;gap:.6rem;justify-content:center;width:100%;max-width:660px}
.touch-pad button{

<body>

<div class="bg-layer bg-grad"></div>
<div class="bg-layer bg-grid"></div>
<div class="bg-layer bg-scan"></div>
<canvas id="fx"></canvas>

<div id="app"></div>
<div id="toasts" class="toasts" role="status" aria-live="polite"></div>
<div id="modal" class="modal-root"></div>

<script type="module">
/* ================================================================
   SLEEPY EMPIRE — FULL PLATFORM
   Single-file build. Backend-abstracted (Firebase | Local IndexedDB).
   ================================================================ */

/* ----------------------------------------------------------------
   1. CONFIGURATION  —  EDIT THIS BLOCK
   ----------------------------------------------------------------
   Fill in your Firebase project config to enable REAL cloud accounts,
   shared leaderboards and multi-device sync.

   If left as-is, the app runs in LOCAL MODE (IndexedDB). Local mode is
   a real, persistent database on this device — but it is per-device and
   not a shared backend. A banner will make the mode obvious.
-------------------------------------------------------------------*/
const FIREBASE_CONFIG = {
  apiKey:            "REPLACE_WITH_YOUR_API_KEY",
  authDomain:        "REPLACE.firebaseapp.com",
  projectId:         "REPLACE_PROJECT_ID",
  storageBucket:     "REPLACE.appspot.com",
  messagingSenderId: "REPLACE_SENDER_ID",
  appId:             "REPLACE_APP_ID"
};

const ADMIN_ID = "admin";            // admin login ID (email becomes admin@sleepyempire.admin)
const ADMIN_EMAIL_DOMAIN = "sleepyempire.admin";
const PLAYER_EMAIL_DOMAIN = "sleepyempire.player";

/* ----------------------------------------------------------------
   2. TINY DOM / UTIL HELPERS
   ----------------------------------------------------------------*/
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const el = (tag, cls, html) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html != null) n.innerHTML = html;
  return n;
};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const fmt = n => Number(n || 0).toLocaleString("en-US");
const fmtDate = ts => {
  if (!ts) return "—";
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  if (isNaN(d)) return "—";
  return d.toLocaleDateString("en-US", { year:"numeric", month:"short", day:"numeric" });
};
const fmtDateTime = ts => {
  if (!ts) return "—";
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  if (isNaN(d)) return "—";
  return d.toLocaleString("en-US", { month:"short", day:"numeric", hour:"2-digit", minute:"2-digit" });
};
const slug = s => String(s || "").toLowerCase().replace(/[^a-z0-9]/g, "");
const sleep = ms => new Promise(r => setTimeout(r, ms));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);

/* ---- toasts ---- */
function toast(msg, kind = "info", ms = 3600) {
  const t = el("div", "toast " + kind);
  const icon = kind === "ok" ? "✅" : kind === "err" ? "⛔" : "ℹ️";
  t.innerHTML = `<span>${icon}</span><span>${esc(msg)}</span>`;
  $("#toasts").appendChild(t);
  setTimeout(() => { t.classList.add("out"); setTimeout(() => t.remove(), 260); }, ms);
}

/* ---- modal ---- */
function modal({ title, body, confirmText = "Confirm", cancelText = "Cancel", danger = false, onConfirm }) {
  const root = $("#modal");
  root.innerHTML = "";
  const wrap = el("div", "modal");
  wrap.innerHTML = `
    <h3>${esc(title)}</h3>
    <p>${body}</p>
    <div class="modal-actions">
      <button class="btn ghost" data-x>${esc(cancelText)}</button>
      <button class="btn ${danger ? "danger" : "primary"}" data-c>${esc(confirmText)}</button>
    </div>`;
  root.appendChild(wrap);
  root.classList.add("on");
  const close = () => { root.classList.remove("on"); root.innerHTML = ""; };
  $("[data-x]", wrap).onclick = close;
  $("[data-c]", wrap).onclick = async () => {
    const btn = $("[data-c]", wrap);
    btn.classList.add("loading");
    try { await onConfirm(); close(); }
    catch (e) { btn.classList.remove("loading"); toast(e.message || "Action failed", "err"); }
  };
  root.onclick = e => { if (e.target === root) close(); };
}

/* ----------------------------------------------------------------
   3. PASSWORD HASHING (local mode) — never store plaintext
   ----------------------------------------------------------------*/
async function hashPassword(pw, salt) {
  const enc = new TextEncoder();
  const key = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits(
    { name: "PBKDF2", salt: enc.encode(salt), iterations: 120000, hash: "SHA-256" },
    key, 256
  );
  return [...new Uint8Array(bits)].map(b => b.toString(16).padStart(2, "0")).join("");
}
const makeSalt = () => [...crypto.getRandomValues(new Uint8Array(16))]
  .map(b => b.toString(16).padStart(2, "0")).join("");

/* ----------------------------------------------------------------
   4. BACKEND — LOCAL (IndexedDB) IMPLEMENTATION
   ----------------------------------------------------------------
   A genuine persistent store. Per-device only. Used when Firebase
   config is not supplied, so the platform remains fully testable.
-------------------------------------------------------------------*/
const LocalDB = (() => {
  const DB_NAME = "sleepy_empire";
  const DB_VER  = 1;
  let db = null;

  function open() {
    return new Promise((res, rej) => {
      if (db) return res(db);
      const req = indexedDB.open(DB_NAME, DB_VER);
      req.onupgradeneeded = e => {
        const d = e.target.result;
        if (!d.objectStoreNames.contains("users"))   d.createObjectStore("users",   { keyPath: "uid" });
        if (!d.objectStoreNames.contains("scores"))  d.createObjectStore("scores",  { keyPath: "id" });
        if (!d.objectStoreNames.contains("news"))    d.createObjectStore("news",    { keyPath: "id" });
        if (!d.objectStoreNames.contains("vlogs"))   d.createObjectStore("vlogs",   { keyPath: "id" });
        if (!d.objectStoreNames.contains("meta"))    d.createObjectStore("meta",    { keyPath: "k" });
      };
      req.onsuccess = () => { db = req.result; res(db); };
      req.onerror = () => rej(req.error);
    });
  }
  async function tx(store, mode, fn) {
    const d = await open();
    return new Promise((res, rej) => {
      const t = d.transaction(store, mode);
      const s = t.objectStore(store);
      let out;
      try { out = fn(s); } catch (e) { return rej(e); }
      t.oncomplete = () => res(out && out.result !== undefined ? out.result : out);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error);
    });
  }
  const put    = (store, val) => tx(store, "readwrite", s => s.put(val));
  const get    = (store, key) => tx(store, "readonly",  s => s.get(key));
  const del    = (store, key) => tx(store, "readwrite", s => s.delete(key));
  const all    = (store)      => tx(store, "readonly",  s => s.getAll());
  const uid    = () => "loc_" + Math.random().toString(36).slice(2, 12) + Date.now().toString(36);

  return {
    mode: "local",
    async init() { await open(); },

    /* --- auth --- */
    async signUp(gameId, password) {
      const idLower = gameId.toLowerCase();
      const users = await all("users");
      if (users.some(u => u.gameIdLower === idLower))
        throw new Error("That Game ID is already taken.");
      const salt = makeSalt();
      const hash = await hashPassword(password, salt);
      const u = {
        uid: uid(), gameId, gameIdLower: idLower,
        salt, hash,
        createdAt: Date.now(), lastLogin: Date.now(),
        status: "active", avatar: gameId.slice(0, 2).toUpperCase(),
        stats: { gamesPlayed: 0, totalScore: 0, bestScore: 0 },
        favGames: [], profileSettings: {}, achievements: []
      };
      await put("users", u);
      return { uid: u.uid };
    },
    async signIn(gameId, password) {
      const idLower = gameId.toLowerCase();
      const users = await all("users");
      const u = users.find(x => x.gameIdLower === idLower);
      if (!u) throw new Error("No account found with that Game ID.");
      const hash = await hashPassword(password, u.salt);
      if (hash !== u.hash) throw new Error("Incorrect password.");
      if (u.status === "disabled") throw new Error("This account has been disabled.");
      u.lastLogin = Date.now();
      await put("users", u);
      return { uid: u.uid };
    },
    async signOut() { return true; },

    /* --- users --- */
    async getUser(uid) { return (await get("users", uid)) || null; },
    async listUsers() {
      const users = await all("users");
      return users.map(u => { const { salt, hash, ...rest } = u; return rest; });
    },
    async updateUser(uid, patch) {
      const u = await get("users", uid);
      if (!u) throw new Error("User not found");
      await put("users", { ...u, ...patch });
    },
    async deleteUser(uid) { await del("users", uid); },

    /* --- scores --- */
    async addScore({ uid, gameId, gameName, score, meta = {} }) {
      const s = { id: uid === "anon" ? uid + "_" + Date.now() : uid + "_" + Date.now() + "_" + Math.random().toString(36).slice(2,7),
                  uid, gameId, gameName, score, meta, createdAt: Date.now(), verified: true };
      await put("scores", s);
      /* update aggregate stats */
      const u = await get("users", uid);
      if (u) {
        const st = u.stats || { gamesPlayed: 0, totalScore: 0, bestScore: 0 };
        st.gamesPlayed += 1;
        st.totalScore  += score;
        st.bestScore    = Math.max(st.bestScore, score);
        u.stats = st;
        await put("users", u);
      }
      return s.id;
    },
    async listScores() { return (await all("scores")).sort((a, b) => b.createdAt - a.createdAt); },
    async deleteScore(id) { await del("scores", id); },

    /* --- news --- */
    async listNews(includeUnpublished = false) {
      const n = await all("news");
      return n.filter(x => includeUnpublished || x.published).sort((a, b) => b.createdAt - a.createdAt);
    },
    async addNews(data) {
      const n = { id: uid(), ...data, createdAt: Date.now(), updatedAt: Date.now() };
      await put("news", n); return n.id;
    },
    async updateNews(id, patch) {
      const n = await get("news", id);
      if (!n) throw new Error("News not found");
      await put("news", { ...n, ...patch, updatedAt: Date.now() });
    },
    async deleteNews(id) { await del("news", id); },

    /* --- vlogs --- */
    async listVlogs(includeUnpublished = false) {
      const v = await all("vlogs");
      return v.filter(x => includeUnpublished || x.published).sort((a, b) => b.createdAt - a.createdAt);
    },
    async addVlog(data) {
      const v = { id: uid(), ...data, createdAt: Date.now(), updatedAt: Date.now() };
      await put("vlogs", v); return v.id;
    },
    async updateVlog(id, patch) {
      const v = await get("vlogs", id);
      if (!v) throw new Error("Vlog not found");
      await put("vlogs", { ...v, ...patch, updatedAt: Date.now() });
    },
    async deleteVlog(id) { await del("vlogs", id); },

    /* --- admin auth (local mode) --- */
    async adminSignIn(adminId, password) {
      const rec = await get("meta", "admin");
      if (!rec) {
        /* bootstrap: first admin login sets the password */
        if (adminId !== ADMIN_ID) throw new Error("Admin not configured.");
        const salt = makeSalt();
        const hash = await hashPassword(password, salt);
        await put("meta", { k: "admin", adminId: ADMIN_ID, salt, hash });
        return { admin: true, bootstrapped: true };
      }
      if (adminId !== rec.adminId) throw new Error("Unknown admin ID.");
      const hash = await hashPassword(password, rec.salt);
      if (hash !== rec.hash) throw new Error("Incorrect admin password.");
      return { admin: true };
    },
    async adminChangePassword(newPassword) {
      const rec = await get("meta", "admin");
      if (!rec) throw new Error("Admin not configured.");
      const salt = makeSalt();
      const hash = await hashPassword(newPassword, salt);
      await put("meta", { ...rec, salt, hash });
    }
  };
})();

/* ----------------------------------------------------------------
   5. BACKEND — FIREBASE IMPLEMENTATION
   ----------------------------------------------------------------*/
async function buildFirebaseBackend() {
  const V = "10.12.0";
  const [appM, authM, fsM] = await Promise.all([
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`),
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`),
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`)
  ]);
  const app  = appM.initializeApp(FIREBASE_CONFIG);
  const auth = authM.getAuth(app);
  const db   = fsM.getFirestore(app);

  const emailFor = id => `${slug(id)}@${PLAYER_EMAIL_DOMAIN}`;
  const adminEmailFor = id => `${slug(id)}@${ADMIN_EMAIL_DOMAIN}`;

  /* Firestore collection refs */
  const C = {
    users:   fsM.collection(db, "users"),
    scores:  fsM.collection(db, "scores"),
    news:    fsM.collection(db, "news"),
    vlogs:   fsM.collection(db, "vlogs"),
    admins:  fsM.collection(db, "admins"),
    meta:    fsM.collection(db, "meta")
  };

  let currentUid = null;
  authM.onAuthStateChanged(auth, u => { currentUid = u ? u.uid : null; });

  async function isAdmin(uid) {
    if (!uid) return false;
    const snap = await fsM.getDoc(fsM.doc(C.admins, uid));
    return snap.exists();
  }

  return {
    mode: "firebase",
    _auth: auth, _db: db, _fs: fsM, _authM: authM,

    async init() { return true; },

    /* ---- auth ---- */
    async signUp(gameId, password) {
      const idLower = gameId.toLowerCase();
      /* Game ID uniqueness via a reservation doc */
      const idRef = fsM.doc(db, "gameIds", idLower);
      const idSnap = await fsM.getDoc(idRef);
      if (idSnap.exists()) throw new Error("That Game ID is already taken.");

      const cred = await authM.createUserWithEmailAndPassword(auth, emailFor(gameId), password);
      await fsM.setDoc(idRef, { uid: cred.user.uid, createdAt: fsM.serverTimestamp() });
      await fsM.setDoc(fsM.doc(C.users, cred.user.uid), {
        gameId, gameIdLower: idLower,
        createdAt: fsM.serverTimestamp(),
        lastLogin: fsM.serverTimestamp(),
        status: "active",
        avatar: gameId.slice(0, 2).toUpperCase(),
        stats: { gamesPlayed: 0, totalScore: 0, bestScore: 0 },
        favGames: [], profileSettings: {}, achievements: []
      });
      return { uid: cred.user.uid };
    },
    async signIn(gameId, password) {
      const cred = await authM.signInWithEmailAndPassword(auth, emailFor(gameId), password);
      const uref = fsM.doc(C.users, cred.user.uid);
      const usnap = await fsM.getDoc(uref);
      if (usnap.exists() && usnap.data().status === "disabled") {
        await authM.signOut(auth);
        throw new Error("This account has been disabled.");
      }
      await fsM.updateDoc(uref, { lastLogin: fsM.serverTimestamp() });
      return { uid: cred.user.uid };
    },
    async signOut() { await authM.signOut(auth); },
    onAuth(cb) { return authM.onAuthStateChanged(auth, cb); },
    get currentUid() { return currentUid; },

    /* ---- users ---- */
    async getUser(uid) {
      const s = await fsM.getDoc(fsM.doc(C.users, uid));
      return s.exists() ? { uid: s.id, ...s.data() } : null;
    },
    async listUsers() {
      const s = await fsM.getDocs(fsM.query(C.users, fsM.orderBy("createdAt", "desc"), fsM.limit(500)));
      return s.docs.map(d => ({ uid: d.id, ...d.data() }));
    },
    async updateUser(uid, patch) {
      await fsM.updateDoc(fsM.doc(C.users, uid), patch);
    },
    async deleteUser(uid) {
      await fsM.deleteDoc(fsM.doc(C.users, uid));
    },

    /* ---- scores ---- */
    async addScore({ uid, gameId, gameName, score, meta = {} }) {
      const ref = await fsM.addDoc(C.scores, {
        uid, gameId, gameName, score, meta,
        createdAt: fsM.serverTimestamp(), verified: true
      });
      /* atomic aggregate update */
      await fsM.updateDoc(fsM.doc(C.users, uid), {
        "stats.gamesPlayed": fsM.increment(1),
        "stats.totalScore":  fsM.increment(score),
        "stats.bestScore":   fsM.increment(0)   /* corrected below if needed */
      });
      const u = await fsM.getDoc(fsM.doc(C.users, uid));
      if (u.exists()) {
        const best = u.data()?.stats?.bestScore || 0;
        if (score > best) await fsM.updateDoc(fsM.doc(C.users, uid), { "stats.bestScore": score });
      }
      return ref.id;
    },
    async listScores() {
      const s = await fsM.getDocs(fsM.query(C.scores, fsM.orderBy("createdAt", "desc"), fsM.limit(500)));
      return s.docs.map(d => ({ id: d.id, ...d.data() }));
    },
    async listScoresForGame(gameId, n = 100) {
      const s = await fsM.getDocs(fsM.query(
        C.scores,
        fsM.where("gameId", "==", gameId),
        fsM.orderBy("score", "desc"),
        fsM.limit(n)
      ));
      return s.docs.map(d => ({ id: d.id, ...d.data() }));
    },
    async deleteScore(id) { await fsM.deleteDoc(fsM.doc(C.scores, id)); },

    /* ---- news ---- */
    async listNews(includeUnpublished = false) {
      const q = includeUnpublished
        ? fsM.query(C.news, fsM.orderBy("createdAt", "desc"), fsM.limit(200))
        : fsM.query(C.news, fsM.where("published", "==", true), fsM.orderBy("createdAt", "desc"), fsM.limit(200));
      const s = await fsM.getDocs(q);
      return s.docs.map(d => ({ id: d.id, ...d.data() }));
    },
    async addNews(data) {
      const r = await fsM.addDoc(C.news, {
        ...data, createdAt: fsM.serverTimestamp(), updatedAt: fsM.serverTimestamp()
      });
      return r.id;
    },
    async updateNews(id, patch) {
      await fsM.updateDoc(fsM.doc(C.news, id), { ...patch, updatedAt: fsM.serverTimestamp() });
    },
    async deleteNews(id) { await fsM.deleteDoc(fsM.doc(C.news, id)); },

    /* ---- vlogs ---- */
    async listVlogs(includeUnpublished = false) {
      const q = includeUnpublished
        ? fsM.query(C.vlogs, fsM.orderBy("createdAt", "desc"), fsM.limit(200))
        : fsM.query(C.vlogs, fsM.where("published", "==", true), fsM.orderBy("createdAt", "desc"), fsM.limit(200));
      const s = await fsM.getDocs(q);
      return s.docs.map(d => ({ id: d.id, ...d.data() }));
    },
    async addVlog(data) {
      const r = await fsM.addDoc(C.vlogs, {
        ...data, createdAt: fsM.serverTimestamp(), updatedAt: fsM.serverTimestamp()
      });
      return r.id;
    },
    async updateVlog(id, patch) {
      await fsM.updateDoc(fsM.doc(C.vlogs, id), { ...patch, updatedAt: fsM.serverTimestamp() });
    },
    async deleteVlog(id) { await fsM.deleteDoc(fsM.doc(C.vlogs, id)); },

    /* ---- admin ---- */
    async adminSignIn(adminId, password) {
      const cred = await authM.signInWithEmailAndPassword(auth, adminEmailFor(adminId), password);
      const ok = await isAdmin(cred.user.uid);
      if (!ok) { await authM.signOut(auth); throw new Error("This account is not an administrator."); }
      return { admin: true };
    },
    async adminCheck() { return isAdmin(currentUid); },
    async adminChangePassword(newPassword) {
      if (!auth.currentUser) throw new Error("Not signed in.");
      await authM.updatePassword(auth.currentUser, newPassword);
    },
    async adminSignOut() { await authM.signOut(auth); }
  };
}

/* ---------- shared canvas helper ---------- */
function makeCanvas(host, wide = false) {
  host.innerHTML = "";
  const stage = el("div", "stage" + (wide ? " wide" : ""));
  const cv = document.createElement("canvas");
  stage.appendChild(cv);
  host.appendChild(stage);
  const ctx = cv.getContext("2d");
  function resize() {
    const r = stage.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width  = Math.max(1, Math.floor(r.width  * dpr));
    cv.height = Math.max(1, Math.floor(r.height * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  const ro = new ResizeObserver(resize); ro.observe(stage);
  return { stage, cv, ctx, W: () => cv.width / (Math.min(window.devicePixelRatio || 1, 2)),
           H: () => cv.height / (Math.min(window.devicePixelRatio || 1, 2)), resize, ro };
}

/* ============ GAME 1 — SNAKE ============ */
function createSnake(host, api) {
  const C = makeCanvas(host);
  const N = 22;                 // grid cells
  let cell, snake, dir, nextDir, food, tick, acc, running, score, speed;
  let last = 0, raf = 0;

  function reset() {
    cell = Math.floor(Math.min(C.W(), C.H()) / N);
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    dir = { x: 1, y: 0 }; nextDir = { x: 1, y: 0 };
    score = 0; speed = 130; acc = 0; running = true; tick = 0;
    placeFood(); api.setScore(0); api.setLabel("LEN 3");
  }
  function placeFood() {
    let p;
    do { p = { x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N) }; }
    while (snake.some(s => s.x === p.x && s.y === p.y));
    food = p;
  }
  function step() {
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if (head.x < 0 || head.y < 0 || head.x >= N || head.y >= N) return die();
    if (snake.some((s, i) => i > 0 && s.x === head.x && s.y === head.y)) return die();
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score += 10 + Math.floor(snake.length / 3);
      api.setScore(score); api.setLabel("LEN " + snake.length);
      speed = Math.max(58, speed - 3.2);
      placeFood();
    } else snake.pop();
  }
  function die() {
    running = false;
    api.end(score, { length: snake.length });
  }
  function draw() {
    const w = C.W(), h = C.H();
    C.ctx.fillStyle = "#04070d"; C.ctx.fillRect(0, 0, w, h);
    // grid
    C.ctx.strokeStyle = "rgba(0,234,255,.05)"; C.ctx.lineWidth = 1;
    for (let i = 0; i <= N; i++) {
      C.ctx.beginPath(); C.ctx.moveTo(i * cell, 0); C.ctx.lineTo(i * cell, N * cell); C.ctx.stroke();
      C.ctx.beginPath(); C.ctx.moveTo(0, i * cell); C.ctx.lineTo(N * cell, i * cell); C.ctx.stroke();
    }
    // food
    C.ctx.shadowBlur = 18; C.ctx.shadowColor = "#ff2e88"; C.ctx.fillStyle = "#ff2e88";
    C.ctx.beginPath();
    C.ctx.arc(food.x * cell + cell / 2, food.y * cell + cell / 2, cell * .34, 0, 7);
    C.ctx.fill();
    // snake
    snake.forEach((s, i) => {
      const t = 1 - i / (snake.length + 4);
      C.ctx.shadowBlur = i === 0 ? 20 : 8;
      C.ctx.shadowColor = "#00eaff";
      C.ctx.fillStyle = i === 0 ? "#b6f7ff" : `rgba(0,234,255,${0.35 + t * 0.6})`;
      const pad = i === 0 ? 1 : 2;
      C.ctx.fillRect(s.x * cell + pad, s.y * cell + pad, cell - pad * 2, cell - pad * 2);
    });
    C.ctx.shadowBlur = 0;
  }
  function loop(t) {
    raf = requestAnimationFrame(loop);
    const dt = t - last; last = t;
    if (running) { acc += dt; while (acc >= speed) { acc -= speed; step(); } }
    draw();
  }
  /* controls */
  function onKey(e) {
    const k = e.key.toLowerCase();
    const M = { arrowup: [0,-1], w: [0,-1], arrowdown: [0,1], s: [0,1],
                arrowleft: [-1,0], a: [-1,0], arrowright: [1,0], d: [1,0] };
    if (M[k]) { e.preventDefault(); const [x, y] = M[k];
      if (x !== -dir.x || y !== -dir.y) nextDir = { x, y }; }
  }
  addEventListener("keydown", onKey);

  /* touch swipe */
  let tx = 0, ty = 0;
  const onTS = e => { const t = e.touches[0]; tx = t.clientX; ty = t.clientY; };
  const onTE = e => {
    const t = e.changedTouches[0]; const dx = t.clientX - tx, dy = t.clientY - ty;
    if (Math.hypot(dx, dy) < 24) return;
    let nd;
    if (Math.abs(dx) > Math.abs(dy)) nd = { x: dx > 0 ? 1 : -1, y: 0 };
    else nd = { x: 0, y: dy > 0 ? 1 : -1 };
    if (nd.x !== -dir.x || nd.y !== -dir.y) nextDir = nd;
  };
  C.stage.addEventListener("touchstart", onTS, { passive: true });
  C.stage.addEventListener("touchend", onTE, { passive: true });

  reset();
  raf = requestAnimationFrame(loop);
  return { destroy() { cancelAnimationFrame(raf); removeEventListener("keydown", onKey); C.ro.disconnect(); } };
}

/* ============ GAME 2 — TIC TAC TOE ============ */
function createTicTacToe(host, api) {
  host.innerHTML = "";
  let board, human, ai, over, wins = 0, losses = 0, draws = 0, rounds = 0;

  const wrap = el("div");
  wrap.style.cssText = "width:100%;max-width:460px;display:flex;flex-direction:column;gap:1rem;align-items:center";
  const hud = el("div", "row");
  hud.style.cssText = "justify-content:center;font-family:var(--fd);font-size:.72rem;letter-spacing:.1em;gap:1.2rem";
  hud.innerHTML = `<span>WINS <b style="color:var(--green)">0</b></span>
                   <span>LOSSES <b style="color:var(--red)">0</b></span>
                   <span>DRAWS <b style="color:var(--gold)">0</b></span>`;
  const grid = el("div");
  grid.style.cssText = "display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;width:100%;max-width:340px";
  const status = el("div", "muted");
  status.style.cssText = "font-family:var(--fd);font-size:.8rem;letter-spacing:.12em;text-align:center;min-height:1.3em";
  const btns = el("div", "row");
  btns.style.cssText = "justify-content:center;margin-top:.4rem";
  const restart = el("button", "btn sm primary", "NEW ROUND");
  const resetAll = el("button", "btn sm ghost", "RESET STATS");
  btns.append(restart, resetAll);
  wrap.append(hud, grid, status, btns);
  host.appendChild(wrap);

  const cells = [];
  for (let i = 0; i < 9; i++) {
    const c = el("button");
    c.style.cssText = `aspect-ratio:1;border-radius:12px;font-size:2rem;font-family:var(--fd);font-weight:900;
      background:rgba(0,234,255,.05);border:1px solid var(--line);color:var(--cyan);cursor:pointer;
      transition:all .2s;display:grid;place-items:center`;
    c.onmouseenter = () => { if (!c.textContent && !over) c.style.borderColor = "var(--cyan)"; };
    c.onmouseleave = () => { c.style.borderColor = "var(--line)"; };
    c.onclick = () => play(i);
    cells.push(c); grid.appendChild(c);
  }

  function updateHud() {
    hud.innerHTML = `<span>WINS <b style="color:var(--green)">${wins}</b></span>
                     <span>LOSSES <b style="color:var(--red)">${losses}</b></span>
                     <span>DRAWS <b style="color:var(--gold)">${draws}</b></span>`;
  }
  function newRound() {
    board = Array(9).fill(""); over = false; human = "X"; ai = "O";
    cells.forEach(c => { c.textContent = ""; c.style.color = "var(--cyan)"; c.disabled = false; });
    status.textContent = "YOUR TURN — YOU ARE X";
    api.setScore(0); api.setLabel("ROUND " + (rounds + 1));
  }
  const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  function winner(b) {
    for (const [a, c, d] of LINES) if (b[a] && b[a] === b[c] && b[a] === b[d]) return b[a];
    return b.every(x => x) ? "draw" : null;
  }
  function minimax(b, player) {
    const w = winner(b);
    if (w === "O") return { score: 10 };
    if (w === "X") return { score: -10 };
    if (w === "draw") return { score: 0 };
    const moves = [];
    for (let i = 0; i < 9; i++) if (!b[i]) {
      b[i] = player;
      const r = minimax(b, player === "O" ? "X" : "O");
      moves.push({ i, score: r.score });
      b[i] = "";
    }
    if (player === "O") return moves.reduce((a, c) => c.score > a.score ? c : a);
    return moves.reduce((a, c) => c.score < a.score ? c : a);
  }
  function finish(res) {
    over = true;
    rounds++;
    if (res === "X") { wins++; status.innerHTML = `<span style="color:var(--green)">YOU WIN!</span>`; }
    else if (res === "O") { losses++; status.innerHTML = `<span style="color:var(--red)">AI WINS</span>`; }
    else { draws++; status.innerHTML = `<span style="color:var(--gold)">DRAW</span>`; }
    updateHud();
    const sc = wins * 10;
    api.setScore(sc);
    /* Report every 1 completed round so stats accumulate */
    api.end(sc, { wins, losses, draws, rounds, result: res });
  }
  function play(i) {
    if (over || board[i]) return;
    board[i] = "X"; cells[i].textContent = "X"; cells[i].style.color = "var(--cyan)";
    let w = winner(board);
    if (w) return finish(w);
    status.textContent = "AI THINKING…";
    setTimeout(() => {
      const m = minimax(board.slice(), "O");
      board[m.i] = "O"; cells[m.i].textContent = "O"; cells[m.i].style.color = "var(--pink)";
      const w2 = winner(board);
      if (w2) return finish(w2);
      status.textContent = "YOUR TURN";
    }, 240);
  }
  restart.onclick = () => newRound();
  resetAll.onclick = () => { wins = losses = draws = rounds = 0; updateHud(); newRound(); toast("Stats reset", "info"); };

  newRound();
  updateHud();
  return { destroy() {} };
}

/* ============ GAME 3 — SPACE SHOOTER ============ */
function createSpaceShooter(host, api) {
  const C = makeCanvas(host, true);
  let raf = 0, last = 0, running = true;
  let player, bullets, enemies, particles, stars, powerups;
  let score, wave, spawnT, shootT, health, fireRate, triple, waveTimer;

  function reset() {
    player = { x: C.W() / 2, y: C.H() - 50, r: 16, cd: 0 };
    bullets = []; enemies = []; particles = []; powerups = [];
    stars = Array.from({ length: 90 }, () => ({
      x: Math.random() * C.W(), y: Math.random() * C.H(),
      s: rnd(.4, 2), v: rnd(18, 70)
    }));
    score = 0; wave = 1; spawnT = 0; shootT = 0; health = 100;
    fireRate = 260; triple = 0; waveTimer = 0; running = true;
    api.setScore(0); api.setLabel("WAVE 1  ❤ 100");
  }
  function spawnEnemy() {
    const w = C.W();
    const type = Math.random() < .18 ? "tank" : Math.random() < .5 ? "fast" : "basic";
    const cfg = {
      basic: { hp: 1, r: 16,  v: 55 + wave * 5,  col: "#ff2e88", pts: 10 },
      fast:  { hp: 1, r: 12,  v: 105 + wave * 7, col: "#ffd54a", pts: 15 },
      tank:  { hp: 3, r: 24,  v: 32 + wave * 3,  col: "#a855f7", pts: 30 }
    }[type];
    enemies.push({ x: rnd(cfg.r, w - cfg.r), y: -cfg.r, ...cfg, vy: cfg.v, t: 0 });
  }
  function boom(x, y, col, n = 12) {
    for (let i = 0; i < n; i++)
      particles.push({ x, y, vx: rnd(-140, 140), vy: rnd(-140, 140), life: rnd(.3, .7), col });
  }
  function loop(t) {
    raf = requestAnimationFrame(loop);
    const dt = Math.min((t - last) / 1000 || 0, .05); last = t;
    if (!running) return;
    const w = C.W(), h = C.H();

    waveTimer += dt;
    if (waveTimer > 18) { waveTimer = 0; wave++; api.setLabel(`WAVE ${wave}  ❤ ${Math.max(0, Math.ceil(health))}`); }

    /* input via keyboard state */
    const K = keys;
    if (K["arrowleft"] || K["a"]) player.x -= 340 * dt;
    if (K["arrowright"] || K["d"]) player.x += 340 * dt;
    if (K["arrowup"] || K["w"]) player.y -= 300 * dt;
    if (K["arrowdown"] || K["s"]) player.y += 300 * dt;
    player.x = clamp(player.x, player.r, w - player.r);
    player.y = clamp(player.y, h * .45, h - player.r - 6);

    /* shooting */
    player.cd -= dt * 1000;
    if ((K[" "] || K["arrowup"] || mouseDown) && player.cd <= 0) {
      player.cd = fireRate;
      const shots = triple > 0 ? [-.18, 0, .18] : [0];
      shots.forEach(a => bullets.push({
        x: player.x + Math.sin(a) * 14, y: player.y - 14,
        vx: Math.sin(a) * 460, vy: -520, r: 3.5
      }));
      if (triple > 0) triple -= 1;
    }

    /* stars */
    stars.forEach(s => { s.y += s.v * dt; if (s.y > h) { s.y = -2; s.x = Math.random() * w; } });

    /* spawn */
    spawnT += dt;
    if (spawnT > Math.max(.28, 1.1 - wave * .06)) { spawnT = 0; spawnEnemy(); }

    /* bullets */
    bullets = bullets.filter(b => {
      b.x += b.vx * dt; b.y += b.vy * dt;
      return b.y > -20 && b.x > -20 && b.x < w + 20;
    });

    /* enemies */
    enemies = enemies.filter(e => {
      e.t += dt;
      e.y += e.vy * dt;
      e.x += Math.sin(e.t * 1.6) * 26 * dt;
      /* collision with bullets */
      for (const b of bullets) {
        if (Math.hypot(b.x - e.x, b.y - e.y) < e.r + b.r) {
          b.dead = true; e.hp--;
          boom(b.x, b.y, e.col, 5);
          if (e.hp <= 0) {
            score += e.pts; api.setScore(score);
            boom(e.x, e.y, e.col, 16);
            if (Math.random() < .12) powerups.push({ x: e.x, y: e.y, v: 90, kind: Math.random() < .5 ? "hp" : "triple" });
            return false;
          }
        }
      }
      /* hit player */
      if (Math.hypot(e.x - player.x, e.y - player.y) < e.r + player.r) {
        health -= e.type === "tank" ? 28 : 16;
        boom(e.x, e.y, "#ff3b5c", 18);
        api.setLabel(`WAVE ${wave}  ❤ ${Math.max(0, Math.ceil(health))}`);
        if (health <= 0) return die();
        return false;
      }
      return e.y < h + 60;
    });
    bullets = bullets.filter(b => !b.dead);

    /* powerups */
    powerups = powerups.filter(p => {
      p.y += p.v * dt;
      if (Math.hypot(p.x - player.x, p.y - player.y) < 26) {
        if (p.kind === "hp") health = Math.min(100, health + 25);
        else triple = 3;
        api.setLabel(`WAVE ${wave}  ❤ ${Math.max(0, Math.ceil(health))}`);
        return false;
      }
      return p.y < h + 30;
    });

    /* particles */
    particles = particles.filter(p => {
      p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt;
      return p.life > 0;
    });

    draw(w, h);
  }
  function die() {
    running = false;
    boom(player.x, player.y, "#00eaff", 40);
    api.end(score, { wave, survival: Math.floor(performance.now() / 1000) });
  }
  function draw(w, h) {
    const g = C.ctx;
    g.fillStyle = "#03060d"; g.fillRect(0, 0, w, h);
    g.fillStyle = "rgba(255,255,255,.55)";
    stars.forEach(s => g.fillRect(s.x, s.y, s.s, s.s));
    /* bullets */
    g.shadowBlur = 14; g.shadowColor = "#00eaff"; g.fillStyle = "#8ef4ff";
    bullets.forEach(b => { g.beginPath(); g.arc(b.x, b.y, b.r, 0, 7); g.fill(); });
    /* enemies */
    enemies.forEach(e => {
      g.shadowBlur = 18; g.shadowColor = e.col; g.fillStyle = e.col;
      g.beginPath();
      g.moveTo(e.x, e.y + e.r);
      g.lineTo(e.x - e.r, e.y - e.r);
      g.lineTo(e.x + e.r, e.y - e.r);
      g.closePath(); g.fill();
    });
    /* powerups */
    powerups.forEach(p => {
      g.shadowBlur = 20; g.shadowColor = "#39ff14"; g.fillStyle = "#39ff14";
      g.font = "18px sans-serif"; g.textAlign = "center";
      g.fillText(p.kind === "hp" ? "❤" : "⚡", p.x, p.y + 6);
    });
    /* player */
    g.shadowBlur = 24; g.shadowColor = "#00eaff"; g.fillStyle = "#b6f7ff";
    g.beginPath();
    g.moveTo(player.x, player.y - player.r);
    g.lineTo(player.x - player.r * .8, player.y + player.r);
    g.lineTo(player.x + player.r * .8, player.y + player.r);
    g.closePath(); g.fill();
    /* particles */
    particles.forEach(p => {
      g.globalAlpha = clamp(p.life * 2, 0, 1);
      g.shadowBlur = 10; g.shadowColor = p.col; g.fillStyle = p.col;
      g.fillRect(p.x, p.y, 3, 3);
    });
    g.globalAlpha = 1; g.shadowBlur = 0;
  }
  /* input */
  const keys = {};
  let mouseDown = false;
  const kd = e => { keys[e.key.toLowerCase()] = true; if ([" ","arrowup","arrowdown","arrowleft","arrowright"].includes(e.key.toLowerCase())) e.preventDefault(); };
  const ku = e => { keys[e.key.toLowerCase()] = false; };
  addEventListener("keydown", kd); addEventListener("keyup", ku);
  C.stage.addEventListener("pointerdown", () => mouseDown = true);
  addEventListener("pointerup", () => mouseDown = false);
  let px = 0;
  C.stage.addEventListener("pointermove", e => {
    const r = C.stage.getBoundingClientRect();
    const scale = C.W() / r.width;
    const nx = (e.clientX - r.left) * scale;
    if (e.buttons) { player.x = clamp(nx, player.r, C.W() - player.r); }
    px = nx;
  });
  C.stage.addEventListener("touchmove", e => {
    const r = C.stage.getBoundingClientRect();
    const scale = C.W() / r.width;
    const t = e.touches[0];
    player.x = clamp((t.clientX - r.left) * scale, player.r, C.W() - player.r);
  }, { passive: true });

  reset();
  raf = requestAnimationFrame(loop);
  return { destroy() {
    cancelAnimationFrame(raf);
    removeEventListener("keydown", kd); removeEventListener("keyup", ku);
    C.ro.disconnect();
  }};
}

/* ============ GAME 4 — ZOMBIE SURVIVAL ============ */
function createZombieSurvival(host, api) {
  const C = makeCanvas(host, true);
  let raf = 0, last = 0, running = true;
  let player, zombies, bullets, particles, blood;
  let score, health, wave, spawnT, shootCd, started, elapsed;

  function reset() {
    player = { x: C.W() / 2, y: C.H() / 2, r: 14, speed: 190, hp: 100, maxHp: 100 };
    zombies = []; bullets = []; particles = [];
    score = 0; health = 100; wave = 1; spawnT = 0; shootCd = 0;
    started = performance.now(); elapsed = 0; running = true;
    api.setScore(0); api.setLabel("WAVE 1  ❤ 100");
  }
  function spawnZombie() {
    const w = C.W(), h = C.H();
    let x, y;
    if (Math.random() < .5) { x = Math.random() < .5 ? -20 : w + 20; y = Math.random() * h; }
    else { x = Math.random() * w; y = Math.random() < .5 ? -20 : h + 20; }
    const fast = Math.random() < .25;
    zombies.push({
      x, y, r: fast ? 11 : 15,
      hp: fast ? 1 : 2 + Math.floor(wave / 3),
      speed: (fast ? 95 : 58) + wave * 4,
      col: fast ? "#8aff5e" : "#39ff14",
      dmg: fast ? 12 : 18
    });
  }
  function boom(x, y, col, n = 10) {
    for (let i = 0; i < n; i++)
      particles.push({ x, y, vx: rnd(-120, 120), vy: rnd(-120, 120), life: rnd(.25, .6), col });
  }
  function loop(t) {
    raf = requestAnimationFrame(loop);
    const dt = Math.min((t - last) / 1000 || 0, .05); last = t;
    if (!running) return;
    const w = C.W(), h = C.H();
    elapsed = (performance.now() - started) / 1000;

    /* waves every 20s */
    const newWave = 1 + Math.floor(elapsed / 20);
    if (newWave !== wave) { wave = newWave; api.setLabel(`WAVE ${wave}  ❤ ${Math.ceil(health)}`); }

    /* move player */
    let mx = 0, my = 0;
    if (keys["w"] || keys["arrowup"]) my -= 1;
    if (keys["s"] || keys["arrowdown"]) my += 1;
    if (keys["a"] || keys["arrowleft"]) mx -= 1;
    if (keys["d"] || keys["arrowright"]) mx += 1;
    /* touch joystick */
    if (joy.active) { mx = joy.x; my = joy.y; }
    const ml = Math.hypot(mx, my) || 1;
    player.x = clamp(player.x + (mx / ml) * player.speed * dt, player.r, w - player.r);
    player.y = clamp(player.y + (my / ml) * player.speed * dt, player.r, h - player.r);

    /* auto-aim + shoot */
    shootCd -= dt * 1000;
    if (shootCd <= 0 && zombies.length) {
      let near = null, nd = 1e9;
      for (const z of zombies) {
        const d = Math.hypot(z.x - player.x, z.y - player.y);
        if (d < nd) { nd = d; near = z; }
      }
      if (near && nd < 340) {
        shootCd = 220;
        const a = Math.atan2(near.y - player.y, near.x - player.x);
        bullets.push({ x: player.x, y: player.y, vx: Math.cos(a) * 620, vy: Math.sin(a) * 620, r: 3 });
      }
    }

    /* spawn */
    spawnT += dt;
    if (spawnT > Math.max(.35, 1.4 - wave * .08)) { spawnT = 0; spawnZombie(); }

    /* bullets */
    bullets = bullets.filter(b => {
      b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.x < -20 || b.y < -20 || b.x > w + 20 || b.y > h + 20) return false;
      for (const z of zombies) {
        if (Math.hypot(b.x - z.x, b.y - z.y) < z.r + b.r) {
          z.hp--; boom(b.x, b.y, "#ffd54a", 4);
          if (z.hp <= 0) {
            boom(z.x, z.y, "#39ff14", 14);
            score += 12; api.setScore(score);
          }
          return false;
        }
      }
      return true;
    });
    zombies = zombies.filter(z => {
      if (z.hp <= 0) return false;
      const a = Math.atan2(player.y - z.y, player.x - z.x);
      z.x += Math.cos(a) * z.speed * dt;
      z.y += Math.sin(a) * z.speed * dt;
      if (Math.hypot(z.x - player.x, z.y - player.y) < z.r + player.r) {
        health -= z.dmg * dt * 1.6;
        api.setLabel(`WAVE ${wave}  ❤ ${Math.max(0, Math.ceil(health))}`);
        if (health <= 0) { die(); return false; }
      }
      return true;
    });
    particles = particles.filter(p => {
      p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt;
      return p.life > 0;
    });
    draw(w, h);
  }
  function die() {
    running = false;
    boom(player.x, player.y, "#ff3b5c", 40);
    api.end(score, { wave, survival: Math.floor(elapsed) });
  }
  function draw(w, h) {
    const g = C.ctx;
    g.fillStyle = "#060a06"; g.fillRect(0, 0, w, h);
    /* grid floor */
    g.strokeStyle = "rgba(57,255,20,.05)"; g.lineWidth = 1;
    for (let x = 0; x < w; x += 42) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke(); }
    for (let y = 0; y < h; y += 42) { g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); }
    /* zombies */
    zombies.forEach(z => {
      g.shadowBlur = 14; g.shadowColor = z.col; g.fillStyle = z.col;
      g.beginPath(); g.arc(z.x, z.y, z.r, 0, 7); g.fill();
      g.fillStyle = "#0b1a0b";
      g.beginPath(); g.arc(z.x - 4, z.y - 3, 2, 0, 7); g.fill();
      g.beginPath(); g.arc(z.x + 4, z.y - 3, 2, 0, 7); g.fill();
    });
    /* bullets */
    g.shadowBlur = 12; g.shadowColor = "#ffd54a"; g.fillStyle = "#ffe9a3";
    bullets.forEach(b => { g.beginPath(); g.arc(b.x, b.y, b.r, 0, 7); g.fill(); });
    /* player */
    g.shadowBlur = 22; g.shadowColor = "#00eaff"; g.fillStyle = "#b6f7ff";
    g.beginPath(); g.arc(player.x, player.y, player.r, 0, 7); g.fill();
    g.fillStyle = "#04121a";
    g.beginPath(); g.arc(player.x, player.y, player.r * .5, 0, 7); g.fill();
    /* particles */
    particles.forEach(p => {
      g.globalAlpha = clamp(p.life * 2, 0, 1);
      g.shadowBlur = 8; g.shadowColor = p.col; g.fillStyle = p.col;
      g.fillRect(p.x, p.y, 3, 3);
    });
    g.globalAlpha = 1; g.shadowBlur = 0;
    /* health bar */
    const bw = w - 24;
    g.fillStyle = "rgba(0,0,0,.55)"; g.fillRect(12, 12, bw, 12);
    g.fillStyle = health > 45 ? "#39ff14" : health > 22 ? "#ffd54a" : "#ff3b5c";
    g.shadowBlur = 12; g.shadowColor = g.fillStyle;
    g.fillRect(12, 12, bw * clamp(health / 100, 0, 1), 12);
    g.shadowBlur = 0;
  }
  /* input */
  const keys = {};
  const kd = e => { keys[e.key.toLowerCase()] = true;
    if (["arrowup","arrowdown","arrowleft","arrowright"," "].includes(e.key.toLowerCase())) e.preventDefault(); };
  const ku = e => keys[e.key.toLowerCase()] = false;
  addEventListener("keydown", kd); addEventListener("keyup", ku);
  const joy = { active: false, x: 0, y: 0 };
  C.stage.addEventListener("touchstart", e => {
    const r = C.stage.getBoundingClientRect();
    const t = e.touches[0];
    const scale = C.W() / r.width;
    const tx = (t.clientX - r.left) * scale, ty = (t.clientY - r.top) * scale;
    /* tap-to-move: set direction toward touch */
    const dx = tx - player.x, dy = ty - player.y;
    const l = Math.hypot(dx, dy) || 1;
    joy.x = dx / l; joy.y = dy / l; joy.active = true;
  }, { passive: true });
  C.stage.addEventListener("touchmove", e => {
    const r = C.stage.getBoundingClientRect();
    const t = e.touches[0];
    const scale = C.W() / r.width;
    const tx = (t.clientX - r.left) * scale, ty = (t.clientY - r.top) * scale;
    const dx = tx - player.x, dy = ty - player.y;
    const l = Math.hypot(dx, dy) || 1;
    joy.x = dx / l; joy.y = dy / l; joy.active = true;
  }, { passive: true });
  const endTouch = () => { joy.active = false; joy.x = joy.y = 0; };
  C.stage.addEventListener("touchend", endTouch);
  C.stage.addEventListener("touchcancel", endTouch);

  reset();
  raf = requestAnimationFrame(loop);
  return { destroy() {
    cancelAnimationFrame(raf);
    removeEventListener("keydown", kd); removeEventListener("keyup", ku);
    C.ro.disconnect();
  }};
}

/* ============ GAME 5 — ENDLESS RUNNER ============ */
function createRunner(host, api) {
  const C = makeCanvas(host, true);
  let raf = 0, last = 0, running = true;
  let player, obstacles, particles, ground, speed, dist, score, spawnT, jumpV, onGround;

  function reset() {
    ground = C.H() - 62;
    player = { x: 110, y: ground - 34, w: 30, h: 34 };
    obstacles = []; particles = [];
    speed = 330; dist = 0; score = 0; spawnT = 0; jumpV = 0; onGround = true; running = true;
    api.setScore(0); api.setLabel("0 M");
  }
  function jump() {
    if (!running || !onGround) return;
    jumpV = -560; onGround = false;
  }
  function loop(t) {
    raf = requestAnimationFrame(loop);
    const dt = Math.min((t - last) / 1000 || 0, .05); last = t;
    if (!running) return;
    const w = C.W(), h = C.H();
    ground = h - 62;

    /* gravity */
    jumpV += 1750 * dt;
    player.y += jumpV * dt;
    if (player.y >= ground - player.h) { player.y = ground - player.h; jumpV = 0; onGround = true; }

    /* speed & distance */
    speed += 7 * dt;
    dist += speed * dt / 12;
    score = Math.floor(dist);
    api.setScore(score);
    api.setLabel(Math.floor(dist) + " M");

    /* spawn obstacles */
    spawnT += dt;
    if (spawnT > Math.max(.5, 1.15 - speed / 1400)) {
      spawnT = 0;
      const type = Math.random();
      if (type < .62) obstacles.push({ x: w + 40, y: ground - 36, w: 26, h: 36, col: "#ff2e88" });
      else if (type < .84) obstacles.push({ x: w + 40, y: ground - 24, w: 44, h: 24, col: "#a855f7" });
      else obstacles.push({ x: w + 40, y: ground - 70, w: 26, h: 34, col: "#ffd54a" }); /* low bar to slide under - must jump over gap */
    }
    obstacles = obstacles.filter(o => {
      o.x -= speed * dt;
      /* collision */
      if (player.x + player.w > o.x && player.x < o.x + o.w &&
          player.y + player.h > o.y && player.y < o.y + o.h) {
        die(); return false;
      }
      return o.x + o.w > -60;
    });
    /* dust */
    if (onGround && Math.random() < .35) particles.push({
      x: player.x, y: ground, vx: rnd(-160, -60), vy: rnd(-70, -10), life: .45, col: "#00eaff"
    });
    particles = particles.filter(p => {
      p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 380 * dt;
      return p.life > 0;
    });
    draw(w, h);
  }
  function die() {
    running = false;
    for (let i = 0; i < 26; i++)
      particles.push({ x: player.x, y: player.y + player.h / 2, vx: rnd(-240, 240), vy: rnd(-240, 60), life: .7, col: "#ff3b5c" });
    setTimeout(() => api.end(score, { distance: Math.floor(dist) }), 260);
  }
  function draw(w, h) {
    const g = C.ctx;
    /* sky */
    const sky = g.createLinearGradient(0, 0, 0, h);
    sky.addColorStop(0, "#0a0716"); sky.addColorStop(1, "#1a0a2a");
    g.fillStyle = sky; g.fillRect(0, 0, w, h);
    /* parallax grid */
    g.strokeStyle = "rgba(0,234,255,.09)"; g.lineWidth = 1;
    for (let i = 0; i < 22; i++) {
      const x = ((i * 90) - (dist * 2.2)) % (w + 180) - 90;
      g.beginPath(); g.moveTo(x, h * .25); g.lineTo(x + 70, h); g.stroke();
    }
    /* ground */
    g.fillStyle = "#08131c"; g.fillRect(0, ground, w, h - ground);
    g.shadowBlur = 22; g.shadowColor = "#00eaff"; g.strokeStyle = "#00eaff"; g.lineWidth = 2;
    g.beginPath(); g.moveTo(0, ground); g.lineTo(w, ground); g.stroke(); g.shadowBlur = 0;
    /* obstacles */
    obstacles.forEach(o => {
      g.shadowBlur = 18; g.shadowColor = o.col; g.fillStyle = o.col;
      g.fillRect(o.x, o.y, o.w, o.h);
    });
    /* player */
    g.shadowBlur = 24; g.shadowColor = "#00eaff"; g.fillStyle = "#b6f7ff";
    g.fillRect(player.x, player.y, player.w, player.h);
    g.fillStyle = "#04121a";
    g.fillRect(player.x + 7, player.y + 9, 6, 6);
    /* particles */
    particles.forEach(p => {
      g.globalAlpha = clamp(p.life * 2.4, 0, 1);
      g.shadowBlur = 8; g.shadowColor = p.col; g.fillStyle = p.col;
      g.fillRect(p.x, p.y, 3, 3);
    });
    g.globalAlpha = 1; g.shadowBlur = 0;
  }
  /* input */
  const kd = e => {
    const k = e.key.toLowerCase();
    if (k === " " || k === "arrowup" || k === "w") { e.preventDefault(); jump(); }
  };
  addEventListener("keydown", kd);
  const tap = () => jump();
  C.stage.addEventListener("pointerdown", tap);
  C.stage.addEventListener("touchstart", e => { e.preventDefault(); jump(); }, { passive: false });

  reset();
  raf = requestAnimationFrame(loop);
  return { destroy() {
    cancelAnimationFrame(raf); removeEventListener("keydown", kd); C.ro.disconnect();
  }};
}

/* ============ GAME 6 — MEMORY MATCH ============ */
function createMemory(host, api) {
  host.innerHTML = "";
  const wrap = el("div");
  wrap.style.cssText = "width:100%;max-width:560px;display:flex;flex-direction:column;gap:1rem;align-items:center";
  const hud = el("div", "hud");
  hud.style.maxWidth = "100%";
  hud.innerHTML = `<div class="pill">TIME<b id="m-time">0.0s</b></div>
                   <div class="pill">ATTEMPTS<b id="m-att">0</b></div>
                   <div class="pill">PAIRS<b id="m-pairs">0/8</b></div>`;
  const grid = el("div");
  grid.style.cssText = "display:grid;grid-template-columns:repeat(4,1fr);gap:.55rem;width:100%;max-width:420px";
  const ctrl = el("div", "row");
  ctrl.style.cssText = "justify-content:center";
  const restart = el("button", "btn sm primary", "NEW GAME");
  ctrl.appendChild(restart);
  wrap.append(hud, grid, ctrl);
  host.appendChild(wrap);

  const ICONS = ["🐍","🚀","🧟","🏃","🧠","🎯","🧱","⭕"];
  let deck, first, lock, attempts, matched, startT, timer, done;

  function build() {
    deck = [...ICONS, ...ICONS]
      .map(v => ({ v, id: Math.random().toString(36).slice(2) }))
      .sort(() => Math.random() - .5);
    first = null; lock = false; attempts = 0; matched = 0; done = false; startT = performance.now();
    grid.innerHTML = "";
    deck.forEach((c, i) => {
      const b = el("button");
      b.style.cssText = `aspect-ratio:1;border-radius:12px;font-size:1.7rem;cursor:pointer;
        background:linear-gradient(135deg,rgba(0,234,255,.10),rgba(168,85,247,.10));
        border:1px solid var(--line);display:grid;place-items:center;transition:all .3s;
        transform-style:preserve-3d;color:transparent`;
      b.dataset.i = i;
      b.onclick = () => flip(i, b);
      grid.appendChild(b);
    });
    clearInterval(timer);
    timer = setInterval(() => {
      if (done) return;
      $("#m-time").textContent = ((performance.now() - startT) / 1000).toFixed(1) + "s";
    }, 100);
    updateHud();
  }
  function updateHud() {
    $("#m-att").textContent = attempts;
    $("#m-pairs").textContent = `${matched}/8`;
  }
  function flip(i, b) {
    if (lock || done || b.dataset.done === "1" || b.dataset.flipped === "1") return;
    b.dataset.flipped = "1";
    b.textContent = deck[i].v; b.style.color = "#fff";
    b.style.background = "linear-gradient(135deg,rgba(0,234,255,.28),rgba(168,85,247,.28))";
    b.style.boxShadow = "0 0 22px rgba(0,234,255,.4)";
    if (first === null) { first = { i, b }; return; }
    attempts++; updateHud();
    if (deck[first.i].v === deck[i].v) {
      first.b.dataset.done = "1"; b.dataset.done = "1";
      first.b.style.borderColor = "var(--green)";
      b.style.borderColor = "var(--green)";
      matched++; updateHud(); first = null;
      if (matched === 8) finish();
    } else {
      lock = true;
      const a = first.b, c = b;
      setTimeout(() => {
        [a, c].forEach(x => {
          x.textContent = ""; x.style.color = "transparent";
          x.style.background = "linear-gradient(135deg,rgba(0,234,255,.10),rgba(168,85,247,.10))";
          x.style.boxShadow = "none"; x.dataset.flipped = "";
        });
        first = null; lock = false;
      }, 720);
    }
  }
  function finish() {
    done = true;
    const secs = (performance.now() - startT) / 1000;
    const score = Math.max(100, Math.round(12000 - secs * 40 - attempts * 90));
    api.setScore(score); api.setLabel(Math.round(secs) + "s");
    api.end(score, { seconds: Math.round(secs * 10) / 10, attempts });
  }
  restart.onclick = build;
  build();
  return { destroy() { clearInterval(timer); } };
}
