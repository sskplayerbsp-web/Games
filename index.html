<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrossPlay Arcade - Mini Games Hub</title>

    <!-- Firebase SDKs from CDN -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js">
    </script>

    <style>
        :root {
            --bg: #0a0a1a;
            --surface: #12122a;
            --surface2: #1a1a3a;
            --accent: #6c5ce7;
            --accent2: #a29bfe;
            --gold: #f9ca24;
            --green: #00d2a0;
            --red: #ff6b6b;
            --text: #e0e0f0;
            --text2: #a0a0c0;
            --border: #2a2a4a;
            --radius: 14px;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --transition: 0.25s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image:
                radial-gradient(ellipse at 20% 20%, rgba(108, 92, 231, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 70%, rgba(0, 210, 160, 0.06) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 50%, rgba(249, 202, 36, 0.03) 0%, transparent 70%);
        }

        #app {
            width: 100%;
            max-width: 900px;
            min-height: 92vh;
            margin: 20px;
            background: var(--surface);
            border-radius: 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Header */
        #header {
            background: var(--surface2);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
            gap: 12px;
        }
        #header .logo {
            font-size: 1.6rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent2), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }
        #header .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.9rem;
            color: var(--text2);
        }
        #header .user-info strong {
            color: var(--text);
            font-weight: 600;
        }
        #header .coins {
            background: #2a1f0a;
            color: var(--gold);
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 5px;
            border: 1px solid #4a3a10;
        }
        .btn {
            padding: 8px 18px;
            border-radius: 25px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: var(--transition);
            letter-spacing: 0.3px;
            font-family: inherit;
        }
        .btn-accent {
            background: var(--accent);
            color: #fff;
        }
        .btn-accent:hover {
            background: #7d6ff0;
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(108, 92, 231, 0.35);
        }
        .btn-outline {
            background: transparent;
            border: 2px solid var(--border);
            color: var(--text);
        }
        .btn-outline:hover {
            border-color: var(--accent2);
            color: #fff;
        }
        .btn-sm {
            padding: 5px 14px;
            font-size: 0.78rem;
            border-radius: 18px;
        }
        .btn-danger {
            background: var(--red);
            color: #fff;
        }
        .btn-danger:hover {
            background: #ff5252;
        }
        .btn-green {
            background: var(--green);
            color: #000;
        }
        .btn-green:hover {
            background: #00e8b0;
        }

        /* Main content */
        #main-content {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Auth screen */
        .auth-container {
            max-width: 400px;
            margin: auto;
            width: 100%;
            text-align: center;
        }
        .auth-container h2 {
            font-size: 2rem;
            margin-bottom: 6px;
            background: linear-gradient(135deg, var(--accent2), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .auth-container .subtitle {
            color: var(--text2);
            margin-bottom: 24px;
            font-size: 0.9rem;
        }
        .input-group {
            margin-bottom: 14px;
            text-align: left;
        }
        .input-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--text2);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border-radius: var(--radius);
            border: 2px solid var(--border);
            background: var(--surface2);
            color: var(--text);
            font-size: 1rem;
            font-family: inherit;
            transition: var(--transition);
        }
        .input-group input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.15);
        }
        .auth-toggle {
            margin-top: 16px;
            color: var(--text2);
            font-size: 0.85rem;
        }
        .auth-toggle span {
            color: var(--accent2);
            cursor: pointer;
            font-weight: 600;
        }
        .auth-toggle span:hover {
            text-decoration: underline;
        }
        .error-msg {
            background: rgba(255, 107, 107, 0.1);
            color: var(--red);
            padding: 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 107, 107, 0.3);
            display: none;
        }

        /* Dashboard */
        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: var(--text2);
            margin-bottom: 4px;
        }
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 14px;
        }
        .game-card {
            background: var(--surface2);
            border-radius: var(--radius);
            padding: 18px 14px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            border: 2px solid transparent;
            position: relative;
            overflow: hidden;
        }
        .game-card:hover {
            border-color: var(--accent);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(108, 92, 231, 0.2);
        }
        .game-card .icon {
            font-size: 3rem;
            margin-bottom: 8px;
        }
        .game-card .name {
            font-weight: 700;
            font-size: 1rem;
        }
        .game-card .mode-tag {
            font-size: 0.7rem;
            padding: 3px 10px;
            border-radius: 10px;
            display: inline-block;
            margin-top: 6px;
            font-weight: 600;
        }
        .tag-solo {
            background: rgba(0, 210, 160, 0.15);
            color: var(--green);
        }
        .tag-multi {
            background: rgba(108, 92, 231, 0.2);
            color: var(--accent2);
        }
        .tag-both {
            background: rgba(249, 202, 36, 0.15);
            color: var(--gold);
        }

        /* Friends list */
        .friends-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .friend-chip {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 25px;
            padding: 8px 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: var(--transition);
        }
        .friend-chip:hover {
            border-color: var(--accent2);
        }
        .friend-chip .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #666;
        }
        .friend-chip .dot.online {
            background: var(--green);
            box-shadow: 0 0 8px rgba(0, 210, 160, 0.5);
        }
        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }
        .leaderboard-table th,
        .leaderboard-table td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        .leaderboard-table th {
            color: var(--text2);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.7rem;
            letter-spacing: 1px;
        }
        .leaderboard-table tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }
        .rank-badge {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.8rem;
        }
        .rank-1 {
            background: #f9ca24;
            color: #000;
        }
        .rank-2 {
            background: #c0c0c0;
            color: #000;
        }
        .rank-3 {
            background: #cd7f32;
            color: #000;
        }

        /* Game screens */
        .game-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            width: 100%;
        }
        .game-screen h2 {
            font-size: 1.4rem;
            letter-spacing: 0.5px;
        }
        .xo-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            width: 100%;
            max-width: 300px;
            aspect-ratio: 1;
        }
        .xo-cell {
            background: var(--surface2);
            border: 2px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            font-size: 3rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            aspect-ratio: 1;
            user-select: none;
        }
        .xo-cell:hover {
            border-color: var(--accent);
            background: #1e1e40;
        }
        .xo-cell.played {
            cursor: default;
        }
        .xo-cell.winner-cell {
            background: rgba(0, 210, 160, 0.2) !important;
            border-color: var(--green) !important;
        }
        .xo-cell.x {
            color: #ff6b6b;
        }
        .xo-cell.o {
            color: #74b9ff;
        }

        .memory-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            max-width: 380px;
            width: 100%;
        }
        .memory-card {
            aspect-ratio: 1;
            background: var(--surface2);
            border: 2px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            font-size: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            user-select: none;
        }
        .memory-card.flipped {
            background: #1e1e40;
            border-color: var(--accent);
        }
        .memory-card.matched {
            background: rgba(0, 210, 160, 0.2);
            border-color: var(--green);
            cursor: default;
        }

        .snake-canvas {
            border: 2px solid var(--border);
            border-radius: var(--radius);
            background: #000;
            max-width: 400px;
            width: 100%;
        }

        .rps-choices {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .rps-choice {
            font-size: 4rem;
            padding: 20px 24px;
            background: var(--surface2);
            border: 3px solid var(--border);
            border-radius: var(--radius);
            cursor: pointer;
            transition: var(--transition);
            user-select: none;
        }
        .rps-choice:hover {
            border-color: var(--accent);
            transform: scale(1.08);
            box-shadow: 0 8px 25px rgba(108, 92, 231, 0.3);
        }
        .rps-choice.selected {
            border-color: var(--gold) !important;
            background: #2a1f0a !important;
            box-shadow: 0 0 20px rgba(249, 202, 36, 0.4);
        }

        .game-status {
            font-size: 1rem;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 20px;
            text-align: center;
        }
        .status-info {
            background: rgba(108, 92, 231, 0.15);
            color: var(--accent2);
        }
        .status-win {
            background: rgba(0, 210, 160, 0.2);
            color: var(--green);
        }
        .status-lose {
            background: rgba(255, 107, 107, 0.2);
            color: var(--red);
        }
        .status-draw {
            background: rgba(249, 202, 36, 0.2);
            color: var(--gold);
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 24px;
            max-width: 450px;
            width: 90%;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal h3 {
            margin-bottom: 16px;
            font-size: 1.2rem;
        }
        .modal .close-btn {
            float: right;
            cursor: pointer;
            font-size: 1.4rem;
            color: var(--text2);
            background: none;
            border: none;
        }
        .modal .close-btn:hover {
            color: #fff;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--surface2);
            color: var(--text);
            padding: 12px 24px;
            border-radius: 25px;
            border: 1px solid var(--border);
            z-index: 200;
            font-weight: 600;
            font-size: 0.9rem;
            box-shadow: var(--shadow);
            animation: fadeInUp 0.3s ease;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        /* Responsive */
        @media (max-width: 600px) {
            #app {
                margin: 8px;
                border-radius: 12px;
                min-height: 96vh;
            }
            #main-content {
                padding: 14px;
                gap: 14px;
            }
            .games-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
            }
            .game-card {
                padding: 12px 8px;
            }
            .game-card .icon {
                font-size: 2.2rem;
            }
            .xo-board {
                max-width: 240px;
                gap: 4px;
            }
            .xo-cell {
                font-size: 2.2rem;
                border-radius: 8px;
            }
            .memory-grid {
                grid-template-columns: repeat(4, 1fr);
                max-width: 280px;
                gap: 5px;
            }
            .memory-card {
                font-size: 1.4rem;
            }
            .rps-choice {
                font-size: 3rem;
                padding: 14px 18px;
            }
            #header {
                padding: 10px 14px;
            }
            #header .logo {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="header" style="display:none;">
            <span class="logo">🎮 CrossPlay Arcade</span>
            <div class="user-info">
                <span class="coins" id="coins-display">🪙 0</span>
                <span>👤 <strong id="display-name">User</strong></span>
                <button class="btn btn-outline btn-sm" onclick="handleLogout()">Logout</button>
            </div>
        </div>
        <div id="main-content"></div>
    </div>
    <div id="toast-container"></div>
    <div id="modal-container"></div>

    <script>
        // ==================== FIREBASE CONFIGURATION ====================
        // 👇 REPLACE THESE WITH YOUR FIREBASE PROJECT CONFIG
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Enable offline persistence
        db.enablePersistence().catch(() => {});

        // ==================== GLOBAL STATE ====================
        let currentUser = null;
        let currentScreen = 'auth'; // auth | dashboard | game
        let currentGame = null;
        let gameData = {}; // Per-game state
        let friendsList = [];
        let userScores = {};
        let activeListeners = []; // Track Firestore listeners for cleanup

        // ==================== UTILITY FUNCTIONS ====================
        function showToast(msg, duration = 2500) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = msg;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), duration);
        }

        function showModal(title, contentHTML, onClose) {
            const container = document.getElementById('modal-container');
            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.innerHTML = `
            <div class="modal">
              <button class="close-btn" id="modal-close">&times;</button>
              <h3>${title}</h3>
              <div>${contentHTML}</div>
            </div>`;
            container.appendChild(overlay);
            overlay.querySelector('#modal-close').addEventListener('click', () => {
                overlay.remove();
                if (onClose) onClose();
            });
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) { overlay.remove(); if (onClose) onClose(); }
            });
            return overlay;
        }

        function cleanupListeners() {
            activeListeners.forEach(unsub => { try { unsub(); } catch (e) {} });
            activeListeners = [];
        }

        // ==================== AUTH ====================
        function renderAuthScreen(isRegister = false) {
            cleanupListeners();
            currentScreen = 'auth';
            document.getElementById('header').style.display = 'none';
            const main = document.getElementById('main-content');
            main.innerHTML = `
            <div class="auth-container">
              <h2>🎮 CrossPlay Arcade</h2>
              <p class="subtitle">Play mini-games with friends worldwide</p>
              <div class="error-msg" id="auth-error"></div>
              <div class="input-group">
                <label>Email</label>
                <input type="email" id="auth-email" placeholder="you@email.com" autocomplete="email">
              </div>
              <div class="input-group">
                <label>Password</label>
                <input type="password" id="auth-password" placeholder="••••••••" autocomplete="current-password">
              </div>
              ${isRegister ? '<div class="input-group"><label>Display Name</label><input type="text" id="auth-name" placeholder="Your name"></div>' : ''}
              <button class="btn btn-accent" style="width:100%;padding:14px;font-size:1rem;" id="auth-submit">
                ${isRegister ? 'Create Account' : 'Login'}
              </button>
              <p class="auth-toggle">
                ${isRegister ? 'Already have an account? <span id="toggle-auth">Login</span>' : 'New here? <span id="toggle-auth">Create Account</span>'}
              </p>
            </div>`;

            document.getElementById('auth-submit').addEventListener('click', () => handleAuth(isRegister));
            document.getElementById('toggle-auth').addEventListener('click', () => renderAuthScreen(!isRegister));
            document.getElementById('auth-password').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') handleAuth(isRegister);
            });
        }

        async function handleAuth(isRegister) {
            const email = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-password').value;
            const name = isRegister ? document.getElementById('auth-name')?.value.trim() : '';
            const errEl = document.getElementById('auth-error');
            errEl.style.display = 'none';

            if (!email || !password) { errEl.textContent =
                    'Please fill in all fields.'; errEl.style.display = 'block'; return; }
            if (password.length < 6) { errEl.textContent =
                    'Password must be at least 6 characters.'; errEl.style.display = 'block'; return; }
            if (isRegister && !name) { errEl.textContent = 'Please enter a display name.'; errEl.style.display =
                'block'; return; }

            try {
                if (isRegister) {
                    const cred = await auth.createUserWithEmailAndPassword(email, password);
                    await db.collection('users').doc(cred.user.uid).set({
                        displayName: name,
                        email: email,
                        coins: 100,
                        totalWins: 0,
                        totalGames: 0,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                        lastOnline: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    await cred.user.updateProfile({ displayName: name });
                } else {
                    await auth.signInWithEmailAndPassword(email, password);
                }
            } catch (err) {
                errEl.textContent = err.message.replace('Firebase: ', '').replace(/\(auth\/.*\)/, '');
                errEl.style.display = 'block';
            }
        }

        function handleLogout() {
            cleanupListeners();
            auth.signOut();
            currentUser = null;
            friendsList = [];
            userScores = {};
            renderAuthScreen();
        }

        // ==================== DASHBOARD ====================
        function renderDashboard() {
            cleanupListeners();
            currentScreen = 'dashboard';
            currentGame = null;
            document.getElementById('header').style.display = 'flex';
            document.getElementById('display-name').textContent = currentUser?.displayName || 'User';
            updateCoinsDisplay();

            const main = document.getElementById('main-content');
            main.innerHTML = `
            <div>
              <p class="section-title">🎲 Games</p>
              <div class="games-grid">
                <div class="game-card" data-game="xo-solo">
                  <div class="icon">❌⭕</div>
                  <div class="name">Tic-Tac-Toe</div>
                  <span class="mode-tag tag-solo">vs AI</span>
                </div>
                <div class="game-card" data-game="xo-multi">
                  <div class="icon">❌⭕</div>
                  <div class="name">Tic-Tac-Toe</div>
                  <span class="mode-tag tag-multi">vs Friend</span>
                </div>
                <div class="game-card" data-game="memory">
                  <div class="icon">🧠</div>
                  <div class="name">Memory Match</div>
                  <span class="mode-tag tag-solo">Solo</span>
                </div>
                <div class="game-card" data-game="snake">
                  <div class="icon">🐍</div>
                  <div class="name">Snake</div>

        async function updateUserOnlineStatus() {
            if (!currentUser) return;
            try {
                await db.collection('users').doc(currentUser.uid).update({
                    lastOnline: firebase.firestore.FieldValue.serverTimestamp()
                });
            } catch (e) { /* ignore */ }
        }

        async function loadFriends() {
            if (!currentUser) return;
            const container = document.getElementById('friends-container');
            if (!container) return;
            try {
                const snapshot = await db.collection('friendships')
                    .where('participants', 'array-contains', currentUser.uid)
                    .where('status', '==', 'accepted')
                    .get();
                friendsList = [];
                const friendUids = new Set();
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const friendUid = data.participants.find(u => u !== currentUser.uid);
                    if (friendUid) friendUids.add({ uid: friendUid, friendshipId: doc.id });
                });
                friendsList = Array.from(friendUids);

                if (friendsList.length === 0) {
                    container.innerHTML =
                        '<span style="color:var(--text2);font-size:0.85rem;">No friends yet. Add some!</span>';
                    return;
                }
                const userSnaps = await Promise.all(
                    friendsList.map(f => db.collection('users').doc(f.uid).get())
                );
                const friendData = userSnaps.map((snap, i) => ({
                    ...friendsList[i],
                    displayName: snap.exists ? snap.data().displayName : 'Unknown',
                    lastOnline: snap.exists ? snap.data().lastOnline?.toDate() : null
                }));
                const now = new Date();
                container.innerHTML = friendData.map(f => {
                    const isOnline = f.lastOnline && (now - f.lastOnline) < 5 * 60 * 1000;
                    return `
                <div class="friend-chip" data-uid="${f.uid}" data-name="${f.displayName}">
                  <span class="dot ${isOnline ? 'online' : ''}"></span>
                  ${f.displayName}
                  <span style="font-size:0.7rem;color:var(--text2);">${isOnline ? 'Online' : 'Offline'}</span>
                </div>`;
                }).join('');
            } catch (e) {
                container.innerHTML = '<span style="color:var(--red);">Error loading friends.</span>';
            }
        }

        async function loadLeaderboard() {
            const tbody = document.querySelector('#leaderboard-table tbody');
            if (!tbody) return;
            try {
                const snapshot = await db.collection('users')
                    .orderBy('totalWins', 'desc')
                    .limit(20)
                    .get();
                const rows = [];
                snapshot.forEach((doc, i) => {
                    const d = doc.data();
                    const winRate = d.totalGames > 0 ? Math.round((d.totalWins / d.totalGames) * 100) : 0;
                    const rankBadge = i < 3 ? `<span class="rank-badge rank-${i+1}">${i+1}</span>` : `#${i+1}`;
                    rows.push(`
                <tr>
                  <td>${rankBadge}</td>
                  <td><strong>${d.displayName || 'Unknown'}</strong></td>
                  <td>${d.totalWins || 0}</td>
                  <td>${d.totalGames || 0}</td>
                  <td>${winRate}%</td>
                </tr>`);
                });
                tbody.innerHTML = rows.join('') ||
                    '<tr><td colspan="5" style="color:var(--text2);">No players yet.</td></tr>';
            } catch (e) {
                tbody.innerHTML = '<tr><td colspan="5" style="color:var(--red);">Error loading leaderboard.</td></tr>';
            }
        }

        async function showAddFriendModal() {
            const overlay = showModal('Add Friend',
                `
            <p style="font-size:0.85rem;color:var(--text2);margin-bottom:12px;">Enter your friend's email address to send a friend request.</p>
            <div class="input-group"><label>Friend's Email</label><input type="email" id="friend-email-input" placeholder="friend@email.com"></div>
            <button class="btn btn-accent" style="width:100%;" id="send-friend-req">Send Request</button>
            <div id="friend-req-status" style="margin-top:10px;font-size:0.85rem;"></div>`
            );
            overlay.querySelector('#send-friend-req').addEventListener('click', async () => {
                const email = overlay.querySelector('#friend-email-input').value.trim();
                const statusEl = overlay.querySelector('#friend-req-status');
                if (!email) { statusEl.textContent = 'Please enter an email.'; statusEl.style.color =
                    'var(--red)'; return; }
                if (email === currentUser.email) { statusEl.textContent =
                    'You cannot add yourself!'; statusEl.style.color = 'var(--red)'; return; }
                try {
                    const snap = await db.collection('users').where('email', '==', email).limit(1).get();
                    if (snap.empty) { statusEl.textContent = 'User not found.'; statusEl.style.color =
                        'var(--red)'; return; }
                    const targetUid = snap.docs[0].id;
                    if (targetUid === currentUser.uid) { statusEl.textContent =
                        'You cannot add yourself!'; statusEl.style.color = 'var(--red)'; return; }
                    const existing = await db.collection('friendships')
                        .where('participants', 'array-contains', currentUser.uid).get();
                    let alreadyExists = false;
                    existing.forEach(doc => {
                        if (doc.data().participants.includes(targetUid)) alreadyExists = true;
                    });
                    if (alreadyExists) { statusEl.textContent =
                        'Friend request already exists or you are already friends.'; statusEl.style
                            .color = 'var(--gold)'; return; }
                    await db.collection('friendships').add({
                        participants: [currentUser.uid, targetUid],
                        status: 'pending',
                        sentBy: currentUser.uid,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    statusEl.textContent = '✅ Friend request sent!';
                    statusEl.style.color = 'var(--green)';
                    setTimeout(() => overlay.remove(), 1500);
                } catch (e) {
                    statusEl.textContent = 'Error: ' + e.message;
                    statusEl.style.color = 'var(--red)';
                }
            });
        }

        // ==================== GAME: TIC-TAC-TOE ====================
        function startXOGame(mode) {
            cleanupListeners();
            currentScreen = 'game';
            currentGame = 'xo';
            gameData = {
                mode: mode, // 'solo' or 'multi'
                board: Array(9).fill(null),
                currentTurn: 'X',
                mySymbol: 'X',
                opponentSymbol: 'O',
                gameId: null,
                opponentUid: null,
                opponentName: null,
                gameOver: false,
                winner: null,
                isMyTurn: true,
            };

            if (mode === 'solo') {
                gameData.mySymbol = 'X';
                gameData.opponentSymbol = 'O';
                gameData.isMyTurn = true;
                renderXOScreen();
            } else {
                // Multiplayer - show friend selection
                showXOFriendSelect();
            }
        }

        function showXOFriendSelect() {
            if (friendsList.length === 0) {
                showToast('You need friends to play multiplayer! Add friends first.');
                renderDashboard();
                return;
            }
            const friendOptions = friendsList.map(f => `
            <button class="btn btn-outline" style="width:100%;margin-bottom:6px;text-align:left;" data-uid="${f.uid}" data-name="${f.displayName}">
              👤 ${f.displayName}
            </button>`).join('');

            const overlay = showModal('Challenge a Friend - Tic-Tac-Toe',
                `
            <p style="font-size:0.85rem;color:var(--text2);margin-bottom:12px;">Select a friend to challenge. They will see your invite on their dashboard.</p>
            ${friendOptions}
            <div id="xo-invite-status" style="margin-top:10px;font-size:0.85rem;"></div>`
            );
            overlay.querySelectorAll('button[data-uid]').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const uid = btn.dataset.uid;
                    const name = btn.dataset.name;
                    gameData.opponentUid = uid;
                    gameData.opponentName = name;
                    gameData.mySymbol = 'X';
                    gameData.opponentSymbol = 'O';
                    gameData.isMyTurn = true;

                    overlay.remove();

        async function createXOMultiGame() {
            try {
                const gameRef = await db.collection('activeGames').add({
                    type: 'xo',
                    board: Array(9).fill(null),
                    currentTurn: 'X',
                    playerX: currentUser.uid,
                    playerXName: currentUser.displayName,
                    playerO: gameData.opponentUid,
                    playerOName: gameData.opponentName,
                    status: 'waiting', // waiting | active | finished
                    winner: null,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    lastMoveAt: firebase.firestore.FieldValue.serverTimestamp(),
                });
                gameData.gameId = gameRef.id;
                showToast('Game invite sent! Waiting for opponent to join...');
                renderXOScreen();
                listenToXOGame();
            } catch (e) {
                showToast('Error creating game: ' + e.message);
                renderDashboard();
            }
        }

        function listenToXOGame() {
            if (!gameData.gameId) return;
            const unsub = db.collection('activeGames').doc(gameData.gameId)
                .onSnapshot(async (snap) => {
                    if (!snap.exists) {
                        showToast('Game was deleted or expired.');
                        cleanupListeners();
                        renderDashboard();
                        return;
                    }
                    const data = snap.data();
                    if (data.status === 'finished') {
                        gameData.board = data.board;
                        gameData.gameOver = true;
                        gameData.winner = data.winner;
                        gameData.currentTurn = data.currentTurn;
                        renderXOScreen();
                        // Award coins
                        if (data.winner === gameData.mySymbol && currentUser) {
                            await awardWin('xo');
                        }
                        if (data.winner === 'draw' && currentUser) {
                            await awardDraw('xo');
                        }
                        setTimeout(() => {
                            cleanupListeners();
                            renderDashboard();
                        }, 3000);
                        return;
                    }
                    if (data.status === 'active') {
                        gameData.board = data.board;
                        gameData.currentTurn = data.currentTurn;
                        gameData.isMyTurn = (data.currentTurn === gameData.mySymbol);
                        gameData.gameOver = false;
                        gameData.winner = null;
                        // Ensure playerO is set if we're joining
                        if (!data.playerO && gameData.opponentUid && data.playerX !== currentUser.uid) {
                            await snap.ref.update({
                                playerO: currentUser.uid,
                                playerOName: currentUser.displayName,
                                status: 'active',
                                lastMoveAt: firebase.firestore.FieldValue.serverTimestamp()
                            });
                            gameData.mySymbol = 'O';
                            gameData.opponentSymbol = 'X';
                            gameData.isMyTurn = false;
                        }
                        if (data.playerO && data.playerX && data.status === 'waiting') {
                            await snap.ref.update({ status: 'active' });
                        }
                        renderXOScreen();
                    }
                });
            activeListeners.push(unsub);
        }

        function renderXOScreen() {
            const main = document.getElementById('main-content');
            const board = gameData.board;
            const winnerCells = getXOWinnerCells(board);

            let statusClass = 'status-info';
            let statusText = '';
            if (gameData.gameOver && gameData.winner === 'draw') {
                statusClass = 'status-draw';
                statusText = "🤝 It's a Draw!";
            } else if (gameData.gameOver && gameData.winner) {
                statusClass = gameData.winner === gameData.mySymbol ? 'status-win' : 'status-lose';
                statusText = gameData.winner === gameData.mySymbol ? '🎉 You Win!' :
                    `😞 ${gameData.opponentName || 'Opponent'} Wins!`;
            } else if (gameData.mode === 'multi' && !gameData.isMyTurn && !gameData.gameOver) {
                statusText = "⏳ Opponent's turn...";
            } else if (!gameData.gameOver) {
                statusText = gameData.isMyTurn ? "👉 Your turn!" : "⏳ Waiting...";
            }

            main.innerHTML = `
            <div class="game-screen">
              <button class="btn btn-outline btn-sm" style="align-self:flex-start;" onclick="cleanupListeners();renderDashboard();">← Back</button>
              <h2>❌ Tic-Tac-Toe ⭕</h2>
              <p style="font-size:0.85rem;color:var(--text2);">
                ${gameData.mode === 'solo' ? 'You vs AI' : `You (${gameData.mySymbol}) vs ${gameData.opponentName || 'Opponent'} (${gameData.opponentSymbol})`}
              </p>
              <span class="game-status ${statusClass}">${statusText}</span>
              <div class="xo-board" id="xo-board">
                ${board.map((cell, i) => `
                  <div class="xo-cell ${cell ? 'played ' + cell.toLowerCase() : ''} ${winnerCells.includes(i) ? 'winner-cell' : ''}"
                       data-index="${i}"
                       style="${cell || gameData.gameOver || !gameData.isMyTurn ? 'cursor:default;' : ''}">
                    ${cell || ''}
                  </div>`).join('')}
              </div>
              ${gameData.gameOver ? '<button class="btn btn-accent" onclick="cleanupListeners();renderDashboard();">Back to Dashboard</button>' : ''}
            </div>`;

            document.querySelectorAll('.xo-cell').forEach(cell => {
                cell.addEventListener('click', () => handleXOClick(parseInt(cell.dataset.index)));
            });
        }

        function getXOWinnerCells(board) {
            const lines = [
                [0, 1, 2],
                [3, 4, 5],
                [6, 7, 8],
                [0, 3, 6],
                [1, 4, 7],
                [2, 5, 8],
                [0, 4, 8],
                [2, 4, 6]
            ];
            for (const [a, b, c] of lines) {
                if (board[a] && board[a] === board[b] && board[a] === board[c]) return [a, b, c];
            }
            return [];
        }

        async function handleXOClick(index) {
            if (gameData.gameOver) return;
            if (gameData.board[index]) return;
            if (!gameData.isMyTurn && gameData.mode === 'multi') return;

            const symbol = gameData.mySymbol;
            const newBoard = [...gameData.board];
            newBoard[index] = symbol;
            gameData.board = newBoard;

            // Check win/draw
            const winnerCells = getXOWinnerCells(newBoard);
            const isDraw = !winnerCells.length && newBoard.every(c => c !== null);
            const winner = winnerCells.length ? symbol : (isDraw ? 'draw' : null);

            if (gameData.mode === 'solo') {
                gameData.isMyTurn = false;
                gameData.currentTurn = 'O';
                renderXOScreen();

                if (winner) {
                    gameData.gameOver = true;
                    gameData.winner = winner;
                    renderXOScreen();
                    if (winner === 'X') await awardWin('xo');
                    if (winner === 'draw') await awardDraw('xo');
                    return;
                }
                // AI move
                setTimeout(() => {
                    if (gameData.gameOver) return;
                    const aiIndex = getAIMove(gameData.board);
                    if (aiIndex !== null && aiIndex >= 0) {
                        gameData.board[aiIndex] = 'O';
                        const aiWinnerCells = getXOWinnerCells(gameData.board);
                        const aiDraw = gameData.board.every(c => c !== null);
                        if (aiWinnerCells.length) {
                            gameData.gameOver = true;
                            gameData.winner = 'O';
                        } else if (aiDraw) {
                            gameData.gameOver = true;
                            gameData.winner = 'draw';
                            awardDraw('xo');
                        }
                    }
                    gameData.isMyTurn = true;
                    gameData.currentTurn = 'X';
                    renderXOScreen();
                    if (gameData.gameOver && gameData.winner === 'O') renderXOScreen();
                }, 350);
            } else {
                // Multiplayer
                gameData.isMyTurn = false;
                gameData.currentTurn = gameData.opponentSymbol;
                if (winner) {
                    gameData.gameOver = true;
                    gameData.winner = winner;
                }
                renderXOScreen();
                // Update Firestore
                if (gameData.gameId) {
                    try {
                        await db.collection('activeGames').doc(gameData.gameId).update({
                            board: gameData.board,
                            currentTurn: gameData.currentTurn,
                            status: winner ? 'finished' : 'active',
                            winner: winner || null,
                            lastMoveAt: firebase.firestore.FieldValue.serverTimestamp()
                        });
                    } catch (e) {
                        showToast('Connection error. Please try again.');
                    }
                }
                if (winner === gameData.mySymbol) await awardWin('xo');
                if (winner === 'draw') await awardDraw('xo');
            }
        }

        function getAIMove(board) {
            const available = board.map((v, i) => v === null ? i : null).filter(v => v !== null);
            if (!available.length) return null;
            // Try to win
            for (const i of available) {
                const test = [...board];
                test[i] = 'O';
                if (getXOWinnerCells(test).length) return i;
            }
            // Block player
            for (const i of available) {
                const test = [...board];
                test[i] = 'X';
                if (getXOWinnerCells(test).length) return i;
            }
            // Center
            if (available.includes(4)) return 4;
            // Corners
            const corners = [0, 2, 6, 8].filter(c => available.includes(c));
            if (corners.length) return corners[Math.floor(Math.random() * corners.length)];
            // Random
            return available[Math.floor(Math.random() * available.length)];
        }

        // ==================== GAME: MEMORY MATCH ====================
        function startMemoryGame() {
            cleanupListeners();
            currentScreen = 'game';
            currentGame = 'memory';
            const emojis = ['🍎', '🍊', '🍋', '🍇', '🍓', '🍒', '🥝', '🍑'];
            const cards = [...emojis, ...emojis].sort(() => Math.random() - 0.5);
            gameData = {
                cards: cards,
                flipped: [],
                matched: new Set(),
                moves: 0,
                lockBoard: false,
            };
            renderMemoryScreen();
        }

        function renderMemoryScreen() {
            const main = document.getElementById('main-content');
            const allMatched = gameData.matched.size === gameData.cards.length;
            main.innerHTML = `
            <div class="game-screen">
              <button class="btn btn-outline btn-sm" style="align-self:flex-start;" onclick="cleanupListeners();renderDashboard();">← Back</button>
              <h2>🧠 Memory Match</h2>
              <p style="font-size:0.85rem;color:var(--text2);">Moves: ${gameData.moves}</p>
              ${allMatched ? '<span class="game-status status-win">🎉 All Matched! Great memory!</span>' : ''}
              <div class="memory-grid" id="memory-grid">
                ${gameData.cards.map((emoji, i) => {
                  const isFlipped = gameData.flipped.includes(i) || gameData.matched.has(i);
                  const isMatched = gameData.matched.has(i);
                  return `<div class="memory-card ${isFlipped ? 'flipped' : ''} ${isMatched ? 'matched' : ''}"
                       data-index="${i}">${isFlipped ? emoji : '❓'}</div>`;
                }).join('')}
              </div>
              ${allMatched ? '<button class="btn btn-accent" onclick="cleanupListeners();renderDashboard();">Back to Dashboard</button>' : ''}
            </div>`;

            document.querySelectorAll('.memory-card').forEach(card => {
                card.addEventListener('click', () => handleMemoryClick(parseInt(card.dataset.index)));
            });
        }

        async function handleMemoryClick(index) {
            if (gameData.lockBoard) return;
            if (gameData.flipped.includes(index)) return;
            if (gameData.matched.has(index)) return;
            if (gameData.flipped.length >= 2) return;

            gameData.flipped.push(index);
            gameData.moves++;
            renderMemoryScreen();

            if (gameData.flipped.length === 2) {
                gameData.lockBoard = true;
                const [a, b] = gameData.flipped;
                if (gameData.cards[a] === gameData.cards[b]) {
                    gameData.matched.add(a);
                    gameData.matched.add(b);
                    gameData.flipped = [];
                    gameData.lockBoard = false;
                    renderMemoryScreen();
                    if (gameData.matched.size === gameData.cards.length) {
                        await awardWin('memory');
                    }
                } else {
                    setTimeout(() => {
                        gameData.flipped = [];
                        gameData.lockBoard = false;
                        renderMemoryScreen();
                    }, 700);
                }
            }
        }

        // ==================== GAME: SNAKE ====================
        function startSnakeGame() {
            cleanupListeners();
            currentScreen = 'game';
            currentGame = 'snake';
            gameData = {
                snake: [{ x: 8, y: 8 }, { x: 7, y: 8 }, { x: 6, y: 8 }],
                direction: { x: 1, y: 0 },
                food: { x: 12, y: 8 },
                score: 0,
                gameOver: false,
                gridSize: 20,
                speed: 120,
                intervalId: null,
            };
            renderSnakeScreen();
            startSnakeLoop();
        }

        function renderSnakeScreen() {
            const main = document.getElementById('main-content');
            main.innerHTML = `
            <div class="game-screen">
              <button class="btn btn-outline btn-sm" style="align-self:flex-start;" onclick="stopSnakeLoop();cleanupListeners();renderDashboard();">← Back</button>
              <h2>🐍 Snake</h2>
              <p style="font-size:0.85rem;color:var(--text2);">Score: ${gameData.score} | Use Arrow Keys</p>
              ${gameData.gameOver ? '<span class="game-status status-lose">💀 Game Over! Score: ' + gameData.score + '</span>' : ''}
              <canvas class="snake-canvas" id="snake-canvas" width="400" height="400"></canvas>
              ${gameData.gameOver ? '<button class="btn btn-accent" onclick="cleanupListeners();renderDashboard();">Back to Dashboard</button>' : ''}
              <p style="font-size:0.7rem;color:var(--text2);">Use ⬆️⬇️⬅️➡️ arrow keys to move</p>
            </div>`;
            drawSnake();
            if (!gameData.gameOver && !gameData.intervalId && currentGame === 'snake') {
                startSnakeLoop();
            }
        }

        function drawSnake() {
            const canvas = document.getElementById('snake-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const cellSize = canvas.width / gameData.gridSize;
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            // Food
            ctx.fillStyle = '#ff6b6b';
            ctx.fillRect(gameData.food.x * cellSize + 1, gameData.food.y * cellSize + 1, cellSize - 2, cellSize - 2);
            // Snake
            gameData.snake.forEach((seg, i) => {
                ctx.fillStyle = i === 0 ? '#00d2a0' : '#00a880';
                ctx.fillRect(seg.x * cellSize + 1, seg.y * cellSize + 1, cellSize - 2, cellSize - 2);
            });
        }

        function startSnakeLoop() {
            if (gameData.intervalId) return;
            gameData.intervalId = setInterval(() => {
                if (gameData.gameOver || currentGame !== 'snake') {
                    stopSnakeLoop();
                    return;
                }
                const head = gameData.snake[0];
                const newHead = { x: head.x + gameData.direction.x, y: head.y + gameData.direction.y };
                // Wrap around
                if (newHead.x < 0) newHead.x = gameData.gridSize - 1;
                if (newHead.x >= gameData.gridSize) newHead.x = 0;
                if (newHead.y < 0) newHead.y = gameData.gridSize - 1;
                if (newHead.y >= gameData.gridSize) newHead.y = 0;
                // Self collision
                if (gameData.snake.some(s => s.x === newHead.x && s.y === newHead.y)) {
                    gameData.gameOver = true;
                    stopSnakeLoop();
                    renderSnakeScreen();
                    if (gameData.score >= 10) awardWin('snake');
                    return;
                }
                gameData.snake.unshift(newHead);
                if (newHead.x === gameData.food.x && newHead.y === gameData.food.y) {
                    gameData.score += 10;
                    gameData.food = {
                        x: Math.floor(Math.random() * gameData.gridSize),
                        y: Math.floor(Math.random() * gameData.gridSize)
                    };
                } else {
                    gameData.snake.pop();
                }
                const canvas = document.getElementById('snake-canvas');
                if (canvas) drawSnake();
                // Update score display
                const scoreEl = document.querySelector('.game-screen p');
                if (scoreEl && !gameData.gameOver) {
                    scoreEl.textContent = 'Score: ' + gameData.score + ' | Use Arrow Keys';
                }
            }, gameData.speed);
            // Keyboard listener
            document.addEventListener('keydown', snakeKeyHandler);
        }

        function snakeKeyHandler(e) {
            if (currentGame !== 'snake' || gameData.gameOver) return;
            const keyMap = {
                ArrowUp: { x: 0, y: -1 },
                ArrowDown: { x: 0, y: 1 },
                ArrowLeft: { x: -1, y: 0 },
                ArrowRight: { x: 1, y: 0 },
            };
            const newDir = keyMap[e.key];
            if (!newDir) return;
            if (newDir.x === -gameData.direction.x && newDir.y === -gameData.direction.y) return;
            if (newDir.x === gameData.direction.x && newDir.y === gameData.direction.y) return;
            gameData.direction = newDir;
            e.preventDefault();
        }

        function stopSnakeLoop() {
            if (gameData.intervalId) {
                clearInterval(gameData.intervalId);
                gameData.intervalId = null;
            }
            document.removeEventListener('keydown', snakeKeyHandler);
        }

        // ==================== GAME: ROCK PAPER SCISSORS (Multiplayer) ====================
        function startRPSGame() {
            cleanupListeners();
            currentScreen = 'game';
            currentGame = 'rps';
            gameData = {
                gameId: null,
                opponentUid: null,
                opponentName: null,
                myChoice: null,
                opponentChoice: null,
                result: null,
                round: 0,
            };
            if (friendsList.length === 0) {
                showToast('You need friends to play multiplayer! Add friends first.');
                renderDashboard();
                return;
            }
            const friendOptions = friendsList.map(f => `
            <button class="btn btn-outline" style="width:100%;margin-bottom:6px;text-align:left;" data-uid="${f.uid}" data-name="${f.displayName}">
              👤 ${f.displayName}
            </button>`).join('');
            const overlay = showModal('Challenge a Friend - Rock Paper Scissors',
                `
            <p style="font-size:0.85rem;color:var(--text2);margin-bottom:12px;">Select a friend to challenge in Rock Paper Scissors!</p>
            ${friendOptions}`
            );
            overlay.querySelectorAll('button[data-uid]').forEach(btn => {
                btn.addEventListener('click', async () => {
                    gameData.opponentUid = btn.dataset.uid;
                    gameData.opponentName = btn.dataset.name;
                    overlay.remove();
                    await createRPSGame();
                });
            });
        }

        async function createRPSGame() {
            try {
                const gameRef = await db.collection('activeGames').add({
                    type: 'rps',
                    player1: currentUser.uid,
                    player1Name: currentUser.displayName,
                    player2: gameData.opponentUid,
                    player2Name: gameData.opponentName,
                    player1Choice: null,
                    player2Choice: null,
                    result: null,
                    status: 'waiting',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                });
                gameData.gameId = gameRef.id;
                gameData.myPlayerNum = 1;
                showToast('Game invite sent! Waiting for opponent...');
                renderRPSScreen();
                listenToRPSGame();
            } catch (e) {
                showToast('Error: ' + e.message);
                renderDashboard();
            }
        }

        function listenToRPSGame() {
            if (!gameData.gameId) return;
            const unsub = db.collection('activeGames').doc(gameData.gameId)
                .onSnapshot((snap) => {
                    if (!snap.exists) { cleanupListeners();
                        renderDashboard(); return; }
                    const data = snap.data();
                    if (data.status === 'finished') {
                        gameData.myChoice = gameData.myPlayerNum === 1 ? data.player1Choice : data
                            .player2Choice;
                        gameData.opponentChoice = gameData.myPlayerNum === 1 ? data.player2Choice : data
                            .player1Choice;
                        gameData.result = data.result;
                        renderRPSScreen();
                        if (data.result === 'win' && data.winnerUid === currentUser.uid) awardWin('rps');
                        if (data.result === 'draw') awardDraw('rps');
                        setTimeout(() => { cleanupListeners();
                            renderDashboard(); }, 3500);
                        return;
                    }
                    if (data.status === 'active') {
                        gameData.myChoice = gameData.myPlayerNum === 1 ? data.player1Choice : data
                            .player2Choice;
                        gameData.opponentChoice = gameData.myPlayerNum === 1 ? data.player2Choice : data
                            .player1Choice;
                        renderRPSScreen();
                    }
                    if (data.player2 && data.status === 'waiting') {
                        snap.ref.update({ status: 'active' });
                    }
                });
            activeListeners.push(unsub);
        }

        function renderRPSScreen() {
            const main = document.getElementById('main-content');
            const choices = ['🪨', '📄', '✂️'];
            const choiceLabels = ['Rock', 'Paper', 'Scissors'];
            const hasChosen = gameData.myChoice !== null && gameData.myChoice !== undefined;
            const bothChosen = hasChosen && gameData.opponentChoice !== null && gameData.opponentChoice !== undefined;
            let resultText = '';
            let resultClass = 'status-info';
            if (bothChosen && gameData.result === 'win') { resultText = '🎉 You Win!';
                resultClass = 'status-win'; } else if (bothChosen && gameData.result === 'lose') { resultText =
                    '😞 You Lose!';
                resultClass = 'status-lose'; } else if (bothChosen && gameData.result === 'draw') { resultText =
                    "🤝 It's a Draw!";
                resultClass = 'status-draw'; } else if (hasChosen) { resultText =
                "⏳ Waiting for opponent..."; } else { resultText = '👉 Choose your move!'; }

            main.innerHTML = `
            <div class="game-screen">
              <button class="btn btn-outline btn-sm" style="align-self:flex-start;" onclick="cleanupListeners();renderDashboard();">← Back</button>
              <h2>🪨 Rock 📄 Paper ✂️ Scissors</h2>
              <p style="font-size:0.85rem;color:var(--text2);">You vs ${gameData.opponentName || 'Opponent'}</p>
              <span class="game-status ${resultClass}">${resultText}</span>
              <div class="rps-choices" id="rps-choices">
                ${choices.map((emoji, i) => `
                  <div class="rps-choice ${gameData.myChoice === i ? 'selected' : ''}" data-choice="${i}" style="${hasChosen ? 'pointer-events:none;opacity:0.6;' : ''}">
                    ${emoji}
                    <div style="font-size:0.7rem;margin-top:4px;">${choiceLabels[i]}</div>
                  </div>`).join('')}
              </div>
              ${bothChosen ? `
                <div style="display:flex;gap:20px;align-items:center;font-size:1.5rem;">
                  <span>You: ${choices[gameData.myChoice] || '?'}</span>
                  <span>vs</span>
                  <span>${gameData.opponentName}: ${choices[gameData.opponentChoice] || '?'}</span>
                </div>
              ` : ''}
              ${bothChosen ? '<button class="btn btn-accent" onclick="cleanupListeners();renderDashboard();">Back to Dashboard</button>' : ''}
            </div>`;

            document.querySelectorAll('.rps-choice').forEach(el => {
                el.addEventListener('click', () => handleRPSChoice(parseInt(el.dataset.choice)));
            });
        }

        async function handleRPSChoice(choice) {
            if (gameData.myChoice !== null && gameData.myChoice !== undefined) return;
            gameData.myChoice = choice;
            renderRPSScreen();
            if (gameData.gameId) {
                const updateKey = gameData.myPlayerNum === 1 ? 'player1Choice' : 'player2Choice';
                try {
                    await db.collection('activeGames').doc(gameData.gameId).update({ [updateKey]: choice });
                    // Check if both have chosen
                    const snap = await db.collection('activeGames').doc(gameData.gameId).get();
                    const data = snap.data();
                    if (data.player1Choice !== null && data.player2Choice !== null && data.player1Choice !== undefined &&
                        data.player2Choice !== undefined) {
                        const p1 = data.player1Choice;
                        const p2 = data.player2Choice;
                        let result, winnerUid = null;
                        if (p1 === p2) { result = 'draw'; } else if (
                            (p1 === 0 && p2 === 2) || (p1 === 1 && p2 === 0) || (p1 === 2 && p2 === 1)
                        ) { result = 'win';
                            winnerUid = data.player1; } else { result = 'lose';
                            winnerUid = data.player2; }
                        await snap.ref.update({
                            result: result,
                            winnerUid: winnerUid,
                            status: 'finished'
                        });
                    }
                } catch (e) {
                    showToast('Error submitting choice.');
                }
            }
        }

        // ==================== SCORE & REWARD SYSTEM ====================
        async function awardWin(gameType) {
            if (!currentUser) return;
            try {
                const userRef = db.collection('users').doc(currentUser.uid);
                const snap = await userRef.get();
                const data = snap.data() || {};
                const coinsEarned = 25;
                await userRef.update({
                    coins: (data.coins || 0) + coinsEarned,
                    totalWins: (data.totalWins || 0) + 1,
                    totalGames: (data.totalGames || 0) + 1,
                });
                userScores.coins = (data.coins || 0) + coinsEarned;
                updateCoinsDisplay();
                showToast(`🏆 You won! +${coinsEarned} coins`);
            } catch (e) { /* ignore */ }
        }

        async function awardDraw(gameType) {
            if (!currentUser) return;
            try {
                const userRef = db.collection('users').doc(currentUser.uid);
                const snap = await userRef.get();
                const data = snap.data() || {};
                const coinsEarned = 5;
                await userRef.update({
                    coins: (data.coins || 0) + coinsEarned,
                    totalGames: (data.totalGames || 0) + 1,
                });
                userScores.coins = (data.coins || 0) + coinsEarned;
                updateCoinsDisplay();
                showToast(`🤝 Draw! +${coinsEarned} coins`);
            } catch (e) { /* ignore */ }
        }

        // ==================== AUTH STATE LISTENER ====================
        auth.onAuthStateChanged(async (user) => {
            cleanupListeners();
            if (user) {
                currentUser = user;
                // Load user scores
                try {
                    const snap = await db.collection('users').doc(user.uid).get();
                    if (snap.exists) {
                        userScores = snap.data();
                        updateCoinsDisplay();
                    }
                } catch (e) { /* ignore */ }
                // Update last online
                await updateUserOnlineStatus();
                // Check for pending friend requests and game invites
                checkPendingItems();
                renderDashboard();
            } else {
                currentUser = null;
                friendsList = [];
                userScores = {};
                renderAuthScreen();
            }
        });

        async function checkPendingItems() {
            if (!currentUser) return;
            // Check for game invites where user is player2
            try {
                const gameInvites = await db.collection('activeGames')
                    .where('player2', '==', currentUser.uid)
                    .where('status', '==', 'waiting')
                    .limit(5)
                    .get();
                gameInvites.forEach(async (doc) => {
                    const data = doc.data();
                    // Auto-join or notify
                    if (data.type === 'xo') {
                        gameData = {
                            mode: 'multi',
                            board: Array(9).fill(null),
                            currentTurn: 'X',
                            mySymbol: 'O',
                            opponentSymbol: 'X',
                            gameId: doc.id,
                            opponentUid: data.player1,
                            opponentName: data.player1Name,
                            gameOver: false,
                            winner: null,
                            isMyTurn: false,
                        };
                        await doc.ref.update({
                            playerO: currentUser.uid,
                            playerOName: currentUser.displayName,
                            status: 'active',
                            lastMoveAt: firebase.firestore.FieldValue.serverTimestamp()
                        });
                        showToast('🎮 Game invite from ' + data.player1Name + '! Joining...');
                        currentScreen = 'game';
                        currentGame = 'xo';
                        renderXOScreen();
                        listenToXOGame();
                    } else if (data.type === 'rps') {
                        gameData = {
                            gameId: doc.id,
                            opponentUid: data.player1,
                            opponentName: data.player1Name,
                            myChoice: null,
                            opponentChoice: null,
                            result: null,
                            myPlayerNum: 2,
                        };
                        await doc.ref.update({ status: 'active' });
                        showToast('🎮 RPS challenge from ' + data.player1Name + '! Joining...');
                        currentScreen = 'game';
                        currentGame = 'rps';
                        renderRPSScreen();
                        listenToRPSGame();
                    }
                });
            } catch (e) { /* ignore */ }

            // Check for pending friend requests
            try {
                const pendingReqs = await db.collection('friendships')
                    .where('participants', 'array-contains', currentUser.uid)
                    .where('status', '==', 'pending')
                    .where('sentBy', '!=', currentUser.uid)
                    .limit(5)
                    .get();
                pendingReqs.forEach(async (doc) => {
                    const data = doc.data();
                    const senderSnap = await db.collection('users').doc(data.sentBy).get();
                    const senderName = senderSnap.exists ? senderSnap.data().displayName : 'Someone';
                    const overlay = showModal('Friend Request',
                        `
                <p><strong>${senderName}</strong> wants to be your friend!</p>
                <div style="display:flex;gap:10px;margin-top:14px;">
                  <button class="btn btn-green" id="accept-req">Accept</button>
                  <button class="btn btn-danger" id="reject-req">Reject</button>
                </div>`
                    );
                    overlay.querySelector('#accept-req').addEventListener('click', async () => {
                        await doc.ref.update({ status: 'accepted' });
                        overlay.remove();
                        showToast('✅ Friend request accepted!');
                        loadFriends();
                    });
                    overlay.querySelector('#reject-req').addEventListener('click', async () => {
                        await doc.ref.delete();
                        overlay.remove();
                        showToast('Friend request rejected.');
                    });
                });
            } catch (e) { /* ignore */ }
        }

        // ==================== INITIAL RENDER ====================
        renderAuthScreen();
        console.log('🎮 CrossPlay Arcade ready!');
        console.log('👉 Configure your Firebase project in the firebaseConfig object.');
        console.log('📋 Features: Auth, Tic-Tac-Toe (AI + Multiplayer), Memory Match, Snake, Rock Paper Scissors (Multiplayer), Friends, Leaderboard, Coins');
    </script>
</body>
