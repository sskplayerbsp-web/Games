<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CrossPlay Arcade - 9 Games Hub</title>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg: #0a0a1a;
            --surface: #12122a;
            --surface2: #1a1a3a;
            --accent: #6c5ce7;
            --accent2: #a29bfe;
            --gold: #f9ca24;
            --green: #00d2a0;
            --red: #ff6b6b;
            --text: #e0e0f0;
            --text2: #a0a0c0;
            --border: #2a2a4a;
            --radius: 14px;
            --chat-width: 320px;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image:
                radial-gradient(ellipse at 20% 20%, rgba(108,92,231,0.12) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 70%, rgba(0,210,160,0.1) 0%, transparent 60%);
            overflow-x: hidden;
        }
        #app {
            width: 100%;
            max-width: 960px;
            min-height: 92vh;
            margin: 20px;
            background: var(--surface);
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(108,92,231,0.25), inset 0 0 15px rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: relative;
        }
        #header {
            background: var(--surface2);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #c084fc, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: var(--text2);
        }
        .user-info strong { color:#fff; font-weight:600; }
        .coins {
            background: #2a1f0a;
            color: var(--gold);
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 700;
            border: 1px solid #4a3a10;
            box-shadow: 0 0 10px rgba(249,202,36,0.4);
        }
        .btn {
            padding: 8px 14px;
            border-radius: 25px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.8rem;
            transition: all 0.25s;
            font-family: inherit;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn-accent { background: var(--accent); color: #fff; box-shadow: 0 0 15px rgba(108,92,231,0.4); }
        .btn-outline { background: transparent; border: 2px solid var(--border); color: var(--text); }
        .btn-sm { padding:4px 12px; font-size:0.7rem; }
        #main-content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            -webkit-overflow-scrolling: touch;
        }
        /* Game Cards Grid */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 10px;
        }
        .game-card {
            background: var(--surface2);
            border-radius: var(--radius);
            padding: 14px 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }
        .game-card:active { transform: scale(0.97); }
        .game-card .icon { font-size: 2rem; margin-bottom: 4px; }
        .game-card .name { font-weight: 700; font-size: 0.85rem; color: #fff; }
        .mode-tag {
            font-size: 0.6rem; padding: 2px 6px; border-radius: 8px;
            display: inline-block; margin-top: 3px; font-weight: 600;
        }
        .tag-multi { background: rgba(108,92,231,0.2); color: var(--accent2); }
        .tag-solo { background: rgba(0,210,160,0.15); color: var(--green); }
        .friends-row {
            display: flex; flex-wrap: wrap; gap: 8px;
        }
        .friend-chip {
            background: var(--surface2); border: 1px solid var(--border);
            border-radius: 20px; padding: 6px 12px;
            display: flex; align-items: center; gap: 6px; font-size: 0.8rem;
        }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: #666; }
        .dot.online { background: var(--green); box-shadow: 0 0 10px var(--green); }
        .leaderboard-table {
            width: 100%; border-collapse: collapse; font-size: 0.8rem;
        }
        .leaderboard-table th, .leaderboard-table td {
            padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border);
        }
        .game-screen {
            display: flex; flex-direction: column; align-items: center; gap: 14px; width: 100%;
        }
        /* Chat Widget */
        #chat-widget {
            position: fixed;
            bottom: 20px; right: 20px;
            z-index: 300;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            max-width: calc(100vw - 40px);
        }
        #chat-toggle {
            width: 50px; height: 50px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 15px rgba(108,92,231,0.6);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem;
            cursor: pointer;
            border: none;
            color: #fff;
            transition: 0.2s;
        }
        #chat-panel {
            display: none;
            width: var(--chat-width);
            max-width: 100%;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: 0 0 20px rgba(108,92,231,0.5);
            margin-bottom: 10px;
            overflow: hidden;
            flex-direction: column;
            max-height: 400px;
        }
        #chat-panel.active {
            display: flex;
        }
        .chat-header {
            background: var(--surface2);
            padding: 10px;
            font-weight: 700;
            text-align: center;
            border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex; flex-direction: column; gap: 6px;
            max-height: 250px;
            -webkit-overflow-scrolling: touch;
        }
        .chat-message {
            max-width: 80%;
            padding: 6px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            word-wrap: break-word;
        }
        .chat-message.mine {
            background: var(--accent);
            align-self: flex-end;
            color: #fff;
        }
        .chat-message.other {
            background: var(--surface2);
            align-self: flex-start;
        }
        .chat-input-area {
            display: flex; padding: 8px; gap: 6px;
            border-top: 1px solid var(--border);
        }
        .chat-input-area input {
            flex:1; padding: 8px; border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--surface2); color: var(--text);
        }
        .friend-select {
            padding: 8px;
            border-bottom: 1px solid var(--border);
            font-size: 0.8rem;
            max-height: 120px;
            overflow-y: auto;
        }
        .friend-option {
            padding: 6px; cursor: pointer; border-radius: 8px;
        }
        .friend-option:hover { background: var(--surface2); }
        .friend-option.active { background: var(--accent); color: #fff; }
        /* Responsive */
        @media (max-width: 600px) {
            #app { margin: 10px; }
            #header { flex-direction: column; align-items: flex-start; }
            .games-grid { grid-template-columns: repeat(3, 1fr); }
            #chat-widget { right: 10px; bottom: 10px; }
            #chat-panel { width: 100%; }
            .modal { max-width: 95%; }
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="header" style="display:none;">
            <span class="logo">🎮 CrossPlay Arcade</span>
            <div class="user-info">
                <span class="coins" id="coins-display">🪙 0</span>
                <span>👤 <strong id="display-name">User</strong></span>
                <button class="btn btn-outline btn-sm" onclick="showProfileModal()">👤 Profile</button>
                <button class="btn btn-outline btn-sm" onclick="handleLogout()">Logout</button>
            </div>
        </div>
        <div id="main-content"></div>
    </div>

    <!-- Chat Widget -->
    <div id="chat-widget">
        <div id="chat-panel">
            <div class="chat-header">
                <span>💬 Chat</span>
                <button class="btn btn-sm btn-outline" id="chat-close" style="border:none;padding:4px 8px;">✕</button>
            </div>
            <div class="friend-select" id="chat-friend-list"></div>
            <div class="chat-messages" id="chat-messages"></div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="Type a message..." />
                <button class="btn btn-accent btn-sm" id="chat-send">Send</button>
            </div>
        </div>
        <button id="chat-toggle">💬</button>
    </div>

    <div id="toast-container"></div>
    <div id="modal-container"></div>

    <script>
        // ==================== FIREBASE CONFIG (NEW PROJECT) ====================
        const firebaseConfig = {
            apiKey: "AIzaSyD-_eWSen7haxJ6EMP-4VKC9uti9LKqeDk",
            authDomain: "or-gaming.firebaseapp.com",
            projectId: "or-gaming",
            storageBucket: "or-gaming.firebasestorage.app",
            messagingSenderId: "864068290420",
            appId: "1:864068290420:web:5de450f95d60f3f37e0e21",
            measurementId: "G-80JRV3R24B"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        db.enablePersistence().catch(e => console.warn('Offline persistence error:', e));

        let currentUser = null;
        let currentScreen = 'auth';
        let currentGame = null;
        let gameData = {};
        let friendsList = [];
        let userScores = {};
        let activeListeners = [];
        let chatUnsubscribe = null;
        let currentChatFriend = null;

        // ---------- UTILS ----------
        function showToast(msg, duration=2500) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--surface2);color:#fff;padding:10px 20px;border-radius:25px;border:1px solid var(--border);z-index:400;font-weight:600;box-shadow:0 0 15px rgba(108,92,231,0.5);animation:fadeInUp 0.3s;';
            toast.textContent = msg;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), duration);
        }
        function showModal(title, html, onClose) {
            const container = document.getElementById('modal-container');
            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:200;display:flex;align-items:center;justify-content:center;';
            overlay.innerHTML = `<div class="modal" style="background:var(--surface);border-radius:14px;padding:20px;max-width:400px;width:90%;border:1px solid var(--border);box-shadow:0 0 30px rgba(108,92,231,0.6);max-height:80vh;overflow-y:auto;">
                <button class="close-btn" style="float:right;background:none;border:none;font-size:1.5rem;color:var(--text2);cursor:pointer;">&times;</button>
                <h3 style="margin-bottom:12px;">${title}</h3><div>${html}</div>
            </div>`;
            container.appendChild(overlay);
            overlay.querySelector('.close-btn').addEventListener('click', () => { overlay.remove(); if(onClose) onClose(); });
            overlay.addEventListener('click', e => { if(e.target === overlay) { overlay.remove(); if(onClose) onClose(); } });
            return overlay;
        }
        function cleanupListeners() { activeListeners.forEach(u => { try{u();}catch(e){} }); activeListeners = []; }

        // ---------- AUTH ----------
        function renderAuthScreen(isRegister=false) {
            cleanupListeners(); currentScreen='auth'; document.getElementById('header').style.display='none';
            document.getElementById('main-content').innerHTML = `
            <div style="max-width:400px;margin:auto;text-align:center;">
              <h2 style="font-size:2rem;margin-bottom:8px;background:linear-gradient(135deg,#c084fc,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;">🎮 CrossPlay Arcade</h2>
              <p style="color:var(--text2);margin-bottom:20px;">Multiplayer games with friends</p>
              <div id="auth-error" style="color:var(--red);margin-bottom:12px;display:none;"></div>
              <div style="margin-bottom:12px;text-align:left;"><label style="display:block;font-size:0.8rem;color:var(--text2);">Email</label><input type="email" id="auth-email" style="width:100%;padding:10px;border-radius:10px;border:2px solid var(--border);background:var(--surface2);color:var(--text);" placeholder="you@email.com"></div>
              <div style="margin-bottom:12px;text-align:left;"><label style="display:block;font-size:0.8rem;color:var(--text2);">Password</label><input type="password" id="auth-password" style="width:100%;padding:10px;border-radius:10px;border:2px solid var(--border);background:var(--surface2);color:var(--text);" placeholder="Min 6 characters"></div>
              ${isRegister ? `
                <div style="margin-bottom:12px;text-align:left;"><label style="display:block;font-size:0.8rem;color:var(--text2);">Display Name</label><input type="text" id="auth-name" style="width:100%;padding:10px;border-radius:10px;border:2px solid var(--border);background:var(--surface2);color:var(--text);" placeholder="Your display name"></div>
                <div style="margin-bottom:12px;text-align:left;"><label style="display:block;font-size:0.8rem;color:var(--text2);">Username (no spaces)</label><input type="text" id="auth-username" style="width:100%;padding:10px;border-radius:10px;border:2px solid var(--border);background:var(--surface2);color:var(--text);" placeholder="Unique username"></div>
              ` : ''}
              <button class="btn btn-accent" style="width:100%;padding:12px;font-size:1rem;" id="auth-submit">${isRegister?'Create Account':'Login'}</button>
              <p style="margin-top:14px;color:var(--text2);">${isRegister ? 'Already have an account? <span id="toggle-auth" style="color:var(--accent2);cursor:pointer;">Login</span>' : 'New here? <span id="toggle-auth" style="color:var(--accent2);cursor:pointer;">Create Account</span>'}</p>
            </div>`;
            document.getElementById('auth-submit').addEventListener('click', () => handleAuth(isRegister));
            document.getElementById('toggle-auth').addEventListener('click', () => renderAuthScreen(!isRegister));
        }
        async function handleAuth(isRegister) {
            const email = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-password').value;
            const name = isRegister ? document.getElementById('auth-name')?.value.trim() : '';
            const username = isRegister ? document.getElementById('auth-username')?.value.trim().toLowerCase() : '';
            const errEl = document.getElementById('auth-error');
            errEl.style.display = 'none';
            if(!email || !password) { errEl.textContent='Fill all fields.'; errEl.style.display='block'; return; }
            if(password.length<6) { errEl.textContent='Password min 6 characters.'; errEl.style.display='block'; return; }
            if(isRegister && !name) { errEl.textContent='Enter a display name.'; errEl.style.display='block'; return; }
            if(isRegister && (!username || username.includes(' ') || username.length<3)) {
                errEl.textContent='Username must be at least 3 characters, no spaces.'; errEl.style.display='block'; return;
            }
            try {
                if(isRegister) {
                    const usernameSnap = await db.collection('users').where('username','==',username).limit(1).get();
                    if(!usernameSnap.empty) { errEl.textContent='Username already taken.'; errEl.style.display='block'; return; }
                    const cred = await auth.createUserWithEmailAndPassword(email, password);
                    await db.collection('users').doc(cred.user.uid).set({
                        displayName:name, username, email, coins:100, totalWins:0, totalGames:0,
                        createdAt:firebase.firestore.FieldValue.serverTimestamp(),
                        lastOnline:firebase.firestore.FieldValue.serverTimestamp(),
                        wins_xo:0, wins_connect4:0, wins_uno:0, wins_checkers:0, wins_hangman:0,
                        wins_rps:0, wins_memory:0, wins_snake:0, wins_numberguess:0
                    });
                    await cred.user.updateProfile({displayName:name});
                } else {
                    await auth.signInWithEmailAndPassword(email, password);
                }
            } catch(e) {
                errEl.textContent = e.message.replace('Firebase: ','').replace(/\(auth\/.*\)/,'');
                errEl.style.display='block';
            }
        }
        function handleLogout() { cleanupListeners(); auth.signOut(); currentUser=null; renderAuthScreen(); }

        // ---------- DASHBOARD ----------
        function renderDashboard() {
            cleanupListeners(); currentScreen='dashboard'; currentGame=null;
            document.getElementById('header').style.display='flex';
            document.getElementById('display-name').textContent = currentUser?.displayName||'User';
            updateCoinsDisplay();
            document.getElementById('main-content').innerHTML = `
            <div>
              <p style="font-weight:700;text-transform:uppercase;color:var(--text2);">🎲 Games (9 total)</p>
              <div class="games-grid">
                <div class="game-card" data-game="xo"><div class="icon">❌⭕</div><div class="name">Tic-Tac-Toe</div><span class="mode-tag tag-multi">2P</span></div>
                <div class="game-card" data-game="connect4"><div class="icon">🔴🟡</div><div class="name">Connect Four</div><span class="mode-tag tag-multi">2P</span></div>
                <div class="game-card" data-game="uno"><div class="icon">🃏</div><div class="name">Uno</div><span class="mode-tag tag-multi">2P</span></div>
                <div class="game-card" data-game="checkers"><div class="icon">⚫⚪</div><div class="name">Checkers</div><span class="mode-tag tag-multi">2P</span></div>
                <div class="game-card" data-game="hangman"><div class="icon">💀📝</div><div class="name">Hangman</div><span class="mode-tag tag-multi">2P</span></div>
                <div class="game-card" data-game="rps"><div class="icon">✂️📄</div><div class="name">Rock Paper Scissors</div><span class="mode-tag tag-multi">2P</span></div>
                <div class="game-card" data-game="memory"><div class="icon">🧠</div><div class="name">Memory Match</div><span class="mode-tag tag-solo">Solo</span></div>
                <div class="game-card" data-game="snake"><div class="icon">🐍</div><div class="name">Snake</div><span class="mode-tag tag-solo">Solo</span></div>
                <div class="game-card" data-game="numberguess"><div class="icon">🔢</div><div class="name">Number Guess</div><span class="mode-tag tag-solo">Solo</span></div>
              </div>
            </div>
            <div>
              <p style="font-weight:700;text-transform:uppercase;color:var(--text2);">👥 Friends <button class="btn btn-outline btn-sm" id="btn-add-friend">+ Add</button></p>
              <div class="friends-row" id="friends-container">Loading...</div>
            </div>
            <div>
              <p style="font-weight:700;text-transform:uppercase;color:var(--text2);">🏆 Overall Leaderboard</p>
              <table class="leaderboard-table" id="leaderboard-table"><thead><tr><th>Rank</th><th>Player</th><th>Wins</th></tr></thead><tbody></tbody></table>
            </div>`;
            document.querySelectorAll('.game-card').forEach(card => {
                card.addEventListener('click', () => showGameModal(card.dataset.game));
            });
            document.getElementById('btn-add-friend').addEventListener('click', showAddFriendModal);
            loadFriends(); loadLeaderboard(); updateUserOnlineStatus();
        }
        function updateCoinsDisplay() {
            const el = document.getElementById('coins-display');
            if(el) el.textContent = '🪙 ' + (userScores.coins||0);
        }
        async function updateUserOnlineStatus() {
            if(currentUser) await db.collection('users').doc(currentUser.uid).update({lastOnline:firebase.firestore.FieldValue.serverTimestamp()}).catch(()=>{});
        }
        async function loadFriends() {
            if(!currentUser) return;
            const container = document.getElementById('friends-container');
            if(!container) return;
            try {
                const snapshot = await db.collection('friendships')
                    .where('participants','array-contains',currentUser.uid)
                    .where('status','==','accepted').get();
                friendsList = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const friendUid = data.participants.find(u => u !== currentUser.uid);
                    if(friendUid) friendsList.push({uid:friendUid, friendshipId:doc.id, displayName:'', online:false});
                });
                if(friendsList.length===0) {
                    container.innerHTML = '<span style="color:var(--text2);">No friends yet. Add someone!</span>';
                    return;
                }
                const userSnaps = await Promise.all(friendsList.map(f => db.collection('users').doc(f.uid).get()));
                const now = new Date();
                container.innerHTML = userSnaps.map((snap,i) => {
                    const d = snap.exists ? snap.data() : {};
                    const isOnline = d.lastOnline && (now - d.lastOnline.toDate()) < 5*60*1000;
                    friendsList[i].displayName = d.displayName||'Unknown';
                    friendsList[i].online = isOnline;
                    return `<div class="friend-chip"><span class="dot ${isOnline?'online':''}"></span>${d.displayName||'Unknown'} ${isOnline?'<span style="font-size:0.6rem;color:var(--green);">Online</span>':''}</div>`;
                }).join('');
            } catch(e) { container.innerHTML = '<span style="color:var(--red);">Error loading friends.</span>'; }
        }
        async function loadLeaderboard() {
            const tbody = document.querySelector('#leaderboard-table tbody');
            if(!tbody) return;
            try {
                const snapshot = await db.collection('users').orderBy('totalWins','desc').limit(20).get();
                tbody.innerHTML = '';
                snapshot.forEach((doc,i) => {
                    const d = doc.data();
                    const rank = i<3 ? ['🥇','🥈','🥉'][i] : (i+1);
                    tbody.innerHTML += `<tr><td>${rank}</td><td>${d.displayName||'?'}</td><td>${d.totalWins||0}</td></tr>`;
                });
                if(snapshot.empty) tbody.innerHTML = '<tr><td colspan="3">No players yet.</td></tr>';
            } catch(e) {
                // fallback client sort
                try {
                    const allUsers = await db.collection('users').get();
                    const sorted = allUsers.docs.map(d=>({...d.data(),id:d.id})).filter(d=>typeof d.totalWins==='number').sort((a,b)=>(b.totalWins||0)-(a.totalWins||0)).slice(0,20);
                    tbody.innerHTML = sorted.map((d,i)=><tr><td>${i+1}</td><td>${d.displayName||'?'}</td><td>${d.totalWins||0}</td></tr>).join('')||'<tr><td colspan="3">No data.</td></tr>';
                } catch(e2) { tbody.innerHTML = '<tr><td colspan="3">Leaderboard unavailable.</td></tr>'; }
            }
        }

        // ---------- PROFILE MODAL (cleaner) ----------
        async function showProfileModal() {
            if(!currentUser) return;
            const d = userScores;
            let pendingRequests = [];
            try {
                const snap = await db.collection('friendships')
                    .where('participants','array-contains',currentUser.uid)
                    .where('status','==','pending').where('sentBy','!=',currentUser.uid).get();
                pendingRequests = snap.docs;
            } catch(e) {}
            const html = `
              <div style="margin-bottom:12px;"><strong>${d.displayName}</strong> (@${d.username})</div>
              <div style="display:flex;justify-content:space-between;margin-bottom:8px;">
                <span>🪙 ${d.coins||0}</span> <span>🏆 ${d.totalWins||0} wins</span>
              </div>
              <button class="btn btn-outline btn-sm" id="copy-username-btn" style="margin-bottom:8px;">📋 Copy Username</button>
              <button class="btn btn-danger btn-sm" id="clear-games-btn" style="margin-bottom:12px;">🗑️ Clear Finished Games</button>
              <hr>
              <div><strong>Friend Requests</strong> ${pendingRequests.length?`<span style="background:var(--red);border-radius:50%;padding:0 6px;">${pendingRequests.length}</span>`:''}</div>
              <div id="requests-list" style="max-height:150px;overflow-y:auto;">
                ${pendingRequests.length===0 ? '<p style="color:var(--text2);">No pending requests.</p>' : ''}
              </div>
            `;
            const overlay = showModal('👤 Profile', html);
            overlay.querySelector('#copy-username-btn').addEventListener('click', () => {
                navigator.clipboard.writeText(userScores.username).then(()=>showToast('Username copied!')).catch(()=>showToast('Failed'));
            });
            overlay.querySelector('#clear-games-btn').addEventListener('click', async () => {
                if(!confirm('Delete all your finished games?')) return;
                const snap = await db.collection('activeGames').where('status','==','finished').get();
                const batch = db.batch();
                snap.forEach(doc => { if(doc.data().participants?.includes(currentUser.uid)) batch.delete(doc.ref); });
                await batch.commit();
                showToast('Finished games cleared!');
            });
            // render requests
            const listEl = overlay.querySelector('#requests-list');
            if(pendingRequests.length) {
                listEl.innerHTML = '';
                pendingRequests.forEach(async reqDoc => {
                    const data = reqDoc.data();
                    const senderSnap = await db.collection('users').doc(data.sentBy).get();
                    const senderName = senderSnap.exists ? senderSnap.data().displayName : 'Unknown';
                    const div = document.createElement('div');
                    div.style.cssText = 'display:flex;justify-content:space-between;align-items:center;margin:4px 0;';
                    div.innerHTML = `<span>${senderName}</span>
                        <div><button class="btn btn-accent btn-sm accept-req" data-fid="${reqDoc.id}">Accept</button>
                        <button class="btn btn-outline btn-sm reject-req" data-fid="${reqDoc.id}">Reject</button></div>`;
                    listEl.appendChild(div);
                });
                listEl.addEventListener('click', async (e) => {
                    const btn = e.target.closest('button');
                    if(!btn) return;
                    const fid = btn.dataset.fid;
                    if(btn.classList.contains('accept-req')) {
                        await db.collection('friendships').doc(fid).update({status:'accepted'});
                        showToast('Friend accepted!'); loadFriends();
                        btn.parentElement.parentElement.remove();
                    } else if(btn.classList.contains('reject-req')) {
                        await db.collection('friendships').doc(fid).delete();
                        btn.parentElement.parentElement.remove();
                    }
                });
            }
        }

        // ---------- ADD FRIEND MODAL (same as before) ----------
        async function showAddFriendModal() {
            const html = `
            <p style="color:var(--text2);">Enter username or display name.</p>
            <input type="text" id="friend-search" style="width:100%;padding:10px;border-radius:20px;border:2px solid var(--border);background:var(--surface2);color:var(--text);margin:10px 0;">
            <button class="btn btn-accent" id="search-btn" style="width:100%;">Search</button>
            <div id="search-results" style="margin-top:10px;"></div>`;
            const overlay = showModal('Add Friend', html);
            overlay.querySelector('#search-btn').addEventListener('click', async () => {
                const query = overlay.querySelector('#friend-search').value.trim().toLowerCase();
                const resDiv = overlay.querySelector('#search-results');
                if(!query) return;
                resDiv.innerHTML = 'Searching...';
                try {
                    let users = [];
                    const snapU = await db.collection('users').where('username','==',query).limit(1).get();
                    snapU.forEach(d => users.push(d));
                    if(users.length===0) {
                        const all = await db.collection('users').get();
                        all.forEach(doc => {
                            if(doc.data().displayName.toLowerCase().includes(query)) users.push(doc);
                        });
                    }
                    if(users.length===0) { resDiv.innerHTML='No user found.'; return; }
                    const friendSnap = await db.collection('friendships').where('participants','array-contains',currentUser.uid).get();
                    const existing = new Set();
                    friendSnap.forEach(doc => { const other = doc.data().participants.find(u=>u!==currentUser.uid); if(other) existing.add(other); });
                    resDiv.innerHTML = users.map(u => {
                        const d = u.data();
                        const isYou = u.id===currentUser.uid;
                        const already = existing.has(u.id);
                        return `<div style="display:flex;justify-content:space-between;margin:6px 0;"><span>${d.displayName} (@${d.username}) ${isYou?'(you)':''}</span>
                        ${!isYou&&!already?`<button class="btn btn-accent btn-sm send-req" data-uid="${u.id}">Send</button>`:''}
                        ${already?'<span style="color:var(--green);">Already friends/pending</span>':''}</div>`;
                    }).join('');
                    resDiv.querySelectorAll('.send-req').forEach(b => {
                        b.addEventListener('click', async () => {
                            const targetUid = b.dataset.uid;
                            b.disabled=true; b.textContent='Sending...';
                            await db.collection('friendships').add({
                                participants:[currentUser.uid,targetUid], status:'pending',
                                sentBy:currentUser.uid, createdAt:firebase.firestore.FieldValue.serverTimestamp()
                            });
                            showToast('Request sent!'); b.textContent='Requested';
                        });
                    });
                } catch(e) { resDiv.innerHTML='Error.'; }
            });
        }

        // ==================== CHAT WIDGET ====================
        document.getElementById('chat-toggle').addEventListener('click', () => {
            const panel = document.getElementById('chat-panel');
            panel.classList.toggle('active');
            if(panel.classList.contains('active')) {
                loadChatFriendList();
            } else {
                if(chatUnsubscribe) { chatUnsubscribe(); chatUnsubscribe=null; }
                currentChatFriend = null;
            }
        });
        document.getElementById('chat-close').addEventListener('click', () => {
            document.getElementById('chat-panel').classList.remove('active');
            if(chatUnsubscribe) { chatUnsubscribe(); chatUnsubscribe=null; }
            currentChatFriend = null;
        });

        async function loadChatFriendList() {
            const container = document.getElementById('chat-friend-list');
            if(friendsList.length===0) {
                container.innerHTML = '<div style="padding:8px;color:var(--text2);">No friends to chat.</div>';
                return;
            }
            container.innerHTML = friendsList.map(f => `
                <div class="friend-option ${currentChatFriend&&currentChatFriend.uid===f.uid?'active':''}" data-uid="${f.uid}">
                    <span class="dot ${f.online?'online':''}" style="display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;"></span>
                    ${f.displayName}
                </div>
            `).join('');
            container.querySelectorAll('.friend-option').forEach(el => {
                el.addEventListener('click', () => {
                    const uid = el.dataset.uid;
                    const friend = friendsList.find(f=>f.uid===uid);
                    if(friend) openChatWithFriend(friend);
                });
            });
        }

        function openChatWithFriend(friend) {
            if(chatUnsubscribe) chatUnsubscribe();
            currentChatFriend = friend;
            document.getElementById('chat-messages').innerHTML = '';
            document.getElementById('chat-friend-list').querySelectorAll('.friend-option').forEach(el => el.classList.remove('active'));
            document.querySelector(`.friend-option[data-uid="${friend.uid}"]`)?.classList.add('active');

            const chatId = [currentUser.uid, friend.uid].sort().join('_');
            const messagesRef = db.collection('chats').doc(chatId).collection('messages').orderBy('timestamp','asc');
            chatUnsubscribe = messagesRef.onSnapshot(snap => {
                const msgDiv = document.getElementById('chat-messages');
                msgDiv.innerHTML = '';
                snap.forEach(doc => {
                    const msg = doc.data();
                    const div = document.createElement('div');
                    div.className = `chat-message ${msg.sender===currentUser.uid?'mine':'other'}`;
                    div.textContent = msg.text;
                    msgDiv.appendChild(div);
                });
                msgDiv.scrollTop = msgDiv.scrollHeight;
            });
        }

        document.getElementById('chat-send').addEventListener('click', async () => {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if(!text || !currentChatFriend) return;
            const chatId = [currentUser.uid, currentChatFriend.uid].sort().join('_');
            try {
                await db.collection('chats').doc(chatId).collection('messages').add({
                    sender: currentUser.uid,
                    text,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
                input.value = '';
            } catch(e) { showToast('Message failed'); }
        });
        document.getElementById('chat-input').addEventListener('keypress', (e) => {
            if(e.key==='Enter') document.getElementById('chat-send').click();
        });

        // ---------- REWARDS ----------
        async function awardWin(gameType) {
            if(!currentUser) return;
            const ref = db.collection('users').doc(currentUser.uid);
            const snap = await ref.get(); const d = snap.data()||{};
            const updates = { coins:(d.coins||0)+25, totalWins:(d.totalWins||0)+1, totalGames:(d.totalGames||0)+1 };
            updates[`wins_${gameType}`] = (d[`wins_${gameType}`]||0)+1;
            try { await ref.update(updates); userScores.coins = (d.coins||0)+25; userScores[`wins_${gameType}`] = updates[`wins_${gameType}`]; }
            catch(e) { showToast('Score update error'); }
            updateCoinsDisplay(); showToast(`🏆 You won! +25 coins`);
        }
        async function awardDraw(gameType) {
            if(!currentUser) return;
            const ref = db.collection('users').doc(currentUser.uid);
            const snap = await ref.get(); const d = snap.data()||{};
            try { await ref.update({ coins:(d.coins||0)+5, totalGames:(d.totalGames||0)+1 }); userScores.coins = (d.coins||0)+5; }
            catch(e) {}
            updateCoinsDisplay(); showToast('🤝 Draw! +5 coins');
        }

        // ==================== AUTH STATE LISTENER ====================
        auth.onAuthStateChanged(async user => {
            cleanupListeners();
            if(user) {
                currentUser = user;
                const snap = await db.collection('users').doc(user.uid).get();
                if(snap.exists) userScores = snap.data();
                updateCoinsDisplay();
                await updateUserOnlineStatus();
                renderDashboard();
            } else { currentUser = null; renderAuthScreen(); }
        });
        renderAuthScreen();
    </script>
